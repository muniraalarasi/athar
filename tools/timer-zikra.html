<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤقت الوقت</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4c9;--card:#ffffff;--ink:#3b2a73;--a:#ff6b6b;--b:#2ec4b6;--c:#ffb703;--d:#6c5ce7;--track:#e9e2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2160;--card:#3a2f7d;--ink:#fff6d6;--track:#5444a8}}
:root[data-theme="dark"]{--bg:#2b2160;--card:#3a2f7d;--ink:#fff6d6;--track:#5444a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-weight:800;text-align:center;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:2rem;margin:4px 0 8px}
.card{background:var(--card);border-radius:32px;padding:16px;border:5px solid var(--d)}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto}
.ring svg.r{width:100%;height:100%;transform:rotate(-90deg)}
.ring .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pet{width:46%;transition:transform .3s}
#pet.shake{animation:sh .35s infinite}
@keyframes sh{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
#pet.dance{animation:dn .6s infinite}
@keyframes dn{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}
#time{font-family:'Lalezar','Cairo',sans-serif;font-size:3.4rem;line-height:1;direction:ltr}
#msg{min-height:2rem;font-size:1.25rem;margin:6px 0}
.presets,.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
button{font-family:inherit;font-weight:800;border:none;border-radius:22px;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.p{background:var(--b);font-size:1.15rem;padding:10px 16px;min-width:76px}
.p.on{background:var(--d)}
.go{background:var(--a);font-size:1.5rem;padding:12px 26px}
.pause{background:var(--c);color:#3b2a73;font-size:1.5rem;padding:12px 22px}
.rs{background:var(--d);font-size:1.5rem;padding:12px 22px}
.mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;background:var(--card);color:var(--ink);font-size:1.5rem;padding:6px 12px;border-radius:50%}
.bar{display:flex;justify-content:center;gap:6px;font-size:1.8rem;margin-top:6px}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-40px;font-size:2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{margin:14px 0 6px;font-size:1rem;opacity:.85}
@media (prefers-reduced-motion:reduce){#pet.shake,#pet.dance,.cf{animation:none}}
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="الصوت">🔊</button>
<main>
<h1>⏰ مؤقت الوقت</h1>
<div class="card">
  <div id="msg">اختر الوقت ثم اضغط ابدأ</div>
  <div class="ring">
    <svg class="r" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--track)" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#2ec4b6" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
    <div class="face">
      <svg id="pet" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="58" rx="34" ry="32" fill="#ffb703"/>
        <circle cx="26" cy="30" r="12" fill="#ffb703"/><circle cx="74" cy="30" r="12" fill="#ffb703"/>
        <circle cx="26" cy="30" r="6" fill="#ff9ec4"/><circle cx="74" cy="30" r="6" fill="#ff9ec4"/>
        <circle cx="38" cy="52" r="7" fill="#fff"/><circle cx="62" cy="52" r="7" fill="#fff"/>
        <circle id="e1" cx="38" cy="53" r="3.5" fill="#3b2a73"/><circle id="e2" cx="62" cy="53" r="3.5" fill="#3b2a73"/>
        <ellipse cx="50" cy="64" rx="5" ry="3.5" fill="#ff6b6b"/>
        <path id="mouth" d="M38 72 Q50 82 62 72" fill="none" stroke="#3b2a73" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div id="time">01:00</div>
    </div>
  </div>
  <div class="bar" id="stars" aria-hidden="true">⭐⭐⭐⭐⭐</div>
  <div class="presets" id="presets"></div>
  <div class="ctl">
    <button class="go" id="go">▶ ابدأ</button>
    <button class="pause" id="pause">⏸ توقف</button>
    <button class="rs" id="rs">🔄 من جديد</button>
  </div>
</div>
<footer>إعداد: ذكرى السعدي</footer>
</main>
<div id="conf"></div>
<script>
(function(){
var total=60,left=60,timer=null,muted=false,ac=null,ending=false;
var $=function(i){return document.getElementById(i)};
var arc=$('arc'),C=326.7;
var presets=[[30,'٣٠ ثانية'],[60,'دقيقة'],[120,'دقيقتان'],[180,'٣ دقائق'],[300,'٥ دقائق'],[600,'١٠ دقائق']];
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac}
function tone(f,t,d,type,v){if(muted)return;var a=audio();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;var s=a.currentTime+(t||0);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v||0.25,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.05)}catch(e){}}
function click(){tone(660,0,.12,'triangle',.2)}
function tick(){tone(880,0,.06,'square',.08)}
function beep(){tone(1000,0,.15,'square',.18)}
function win(){var n=[523,659,784,1047,784,1047,1319];n.forEach(function(f,i){tone(f,i*.18,.3,'triangle',.3)})}
function say(t){if(muted)return;try{var u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function face(kind){var m=$('mouth'),e1=$('e1'),e2=$('e2');
 if(kind==='happy'){m.setAttribute('d','M36 70 Q50 90 64 70 Z');m.setAttribute('fill','#ff6b6b')}
 else if(kind==='worry'){m.setAttribute('d','M40 78 Q50 70 60 78');m.setAttribute('fill','none')}
 else{m.setAttribute('d','M38 72 Q50 82 62 72');m.setAttribute('fill','none')}}
function draw(){
 $('time').textContent=fmt(left);
 var r=total?left/total:0;arc.setAttribute('stroke-dashoffset',String(C*(1-r)));
 arc.setAttribute('stroke',r>.5?'#2ec4b6':(r>.2?'#ffb703':'#ff6b6b'));
 var n=Math.ceil(r*5-1e-9);if(left===0)n=0;
 var s='';for(var i=0;i<5;i++)s+=i<n?'⭐':'☆';$('stars').textContent=s;
}
function setMsg(t){$('msg').textContent=t}
function stop(){clearInterval(timer);timer=null}
function pickPreset(sec){stop();ending=false;total=left=sec;
 var bs=document.querySelectorAll('.p');bs.forEach(function(b){b.classList.toggle('on',+b.dataset.s===sec)});
 $('pet').className='';face('smile');setMsg('اضغط ابدأ');draw()}
presets.forEach(function(p){var b=document.createElement('button');b.className='p';b.dataset.s=p[0];b.textContent=p[1];
 b.onclick=function(){click();pickPreset(p[0])};$('presets').appendChild(b)});
function confetti(){var box=$('conf'),e=['🎉','⭐','🎈','🌟','🎊','🍭'];
 for(var i=0;i<30;i++){var d=document.createElement('div');d.className='cf';d.textContent=e[i%e.length];
 d.style.left=Math.random()*100+'%';d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=(Math.random()*.8)+'s';box.appendChild(d)}
 setTimeout(function(){box.innerHTML=''},6000)}
function finish(){stop();ending=true;left=0;draw();$('pet').className='dance';face('happy');setMsg('🎉 انتهى الوقت! أحسنت 🎉');win();setTimeout(function(){say('انتهى الوقت، أحسنت')},900);confetti()}
function step(){left--;
 if(left<=0){finish();return}
 if(left<=10){beep();$('pet').className='shake';face('worry');setMsg('بقي القليل! ⏳')}
 else{tick();if(left<=total/2&&total>=30)setMsg('أنت رائع، استمر 💪')}
 draw()}
$('go').onclick=function(){audio();click();
 if(timer)return;
 if(left<=0||ending){left=total;ending=false}
 $('pet').className='';face('smile');setMsg('هيا نبدأ! 🚀');say('هيا نبدأ');
 timer=setInterval(step,1000);draw()};
$('pause').onclick=function(){click();if(timer){stop();$('pet').className='';setMsg('توقف الوقت ⏸')}};
$('rs').onclick=function(){click();stop();ending=false;left=total;$('pet').className='';face('smile');setMsg('اضغط ابدأ');draw()};
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{speechSynthesis.cancel()}catch(e){}if(!muted)click()};
pickPreset(60);
})();
</script>
</body>
</html>
