.scene{min-height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:8px 10px 0;padding:8px 14px;background:rgba(255,255,255,.93);border-radius:16px;box-shadow:0 4px 14px rgba(80,40,0,.25);text-align:center;font-weight:700;font-size:clamp(11px,2.8vw,16px);line-height:1.5}
.badge{display:grid;place-items:center;min-width:64px;padding:8px 10px;border-radius:14px;font-weight:800;font-size:clamp(11px,2.6vw,15px);line-height:1.3}
.school{background:#f6e3b8;border:2px solid #b8860b}
.vision{background:#1e5b4f;color:#f6e3b8;border:2px solid #c9a24a}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px}
.timer{position:relative;width:min(300px,70vw);aspect-ratio:1;background:var(--card);border-radius:50%;box-shadow:0 10px 30px rgba(60,30,0,.45);display:grid;place-items:center;backdrop-filter:blur(3px)}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.digits{font-size:clamp(48px,15vw,76px);font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;z-index:1}
.msg{position:absolute;bottom:22%;font-size:18px;font-weight:700;color:#b3261e;z-index:1}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:30px;padding:12px 26px;color:#fff;background:linear-gradient(#ff9a3c,#e8590c);box-shadow:0 5px 0 #a63d00;cursor:pointer}
button.alt{background:linear-gradient(#3fb98a,#1f8f66);box-shadow:0 5px 0 #136045}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a63d00}
.girl{position:absolute;right:1%;bottom:0;height:min(64vh,560px);width:auto;filter:drop-shadow(0 10px 10px rgba(40,20,0,.5));transform-origin:50% 100%;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.015)}}
@media (max-width:760px){main{justify-content:flex-start}.girl{position:relative;left:auto;margin-top:16px;height:min(34vh,300px)}}
.done .timer{animation:pop .5s ease infinite alternate}
@keyframes pop{to{transform:scale(1.07)}}
.credits{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;margin:0 10px;font-weight:700;font-size:clamp(13px,3.4vw,18px);background:rgba(255,255,255,.88);border-radius:14px 14px 0 0}
.logo{height:clamp(46px,10vw,74px);width:auto;display:block}
@media (max-width:760px){body{background-position:65% 0}.timer{width:min(300px,62vw)}.girl{right:auto;align-self:flex-start;height:min(22vh,210px);margin-top:12px}}
.title{align-self:center;margin:10px 10px 0;padding:6px 26px;border-radius:30px;background:rgba(18,84,66,.94);color:#fff;border:3px solid #e2b94a;box-shadow:0 5px 14px rgba(0,0,0,.35);font-weight:800;font-size:clamp(18px,5vw,32px);text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.35)}
main{padding-top:clamp(120px,22vh,240px)}
</style>
</head>

<script>
const TOTAL=600, C=565.5;
const $=id=>document.getElementById(id);
let left=TOTAL, endAt=0, raf=0, running=false, muted=false;
let ac, master, noiseBuf, step=0, nextT=0, sched=0;

function show(){
  const s=Math.max(0,Math.ceil(Math.min(left,TOTAL)-0.0001));
  $('digits').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  $('ring').setAttribute('stroke-dashoffset',(C*(1-left/TOTAL)).toFixed(1));
}
function tick(){
  left=(endAt-performance.now())/1000;
  if(left<=0){left=0;show();finish();return}
  show();raf=requestAnimationFrame(tick);
}
/* ---------- audio ---------- */
function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=muted?0:.5;master.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const hz=n=>261.63*Math.pow(2,n/12);
function tone(t,n,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=hz(n);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(t,dur,vol,hp){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
function kick(t){
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.22);
}
const ROOTS=[0,5,7,0], ARP=[0,4,7,12,7,4,7,12], MEL=[19,19,21,19,16,16,14,16, 17,17,19,17,14,14,12,14, 19,21,23,21,19,16,19,24, 24,23,21,19,16,19,24,24];
function playStep(s,t){
  const bar=Math.floor(s/8)%4, i=s%8, root=ROOTS[bar];
  tone(t,root-12+(i%4===2?12:0),.18,'triangle',.5);
  tone(t,root+ARP[i],.14,'square',.09);
  if(s%32<32)tone(t,MEL[s%32]+(bar===3?0:0),.17,'sawtooth',.07);
  if(i%2===0)kick(t);
  if(i===2||i===6){noise(t,.12,.35,1800)}
  noise(t,.04,.12,7000);
}
function scheduler(){
  while(nextT<ac.currentTime+.25){playStep(step,nextT);nextT+=.19;step++}
}
function musicOn(){initAudio();ac.resume();if(sched)return;nextT=ac.currentTime+.05;sched=setInterval(scheduler,50)}
function musicOff(){clearInterval(sched);sched=0}
function fanfare(){
  if(!ac)return;const t=ac.currentTime+.05;
  [0,4,7,12,7,12,16,19,24].forEach((n,i)=>{tone(t+i*.12,n+12,.35,'square',.15);tone(t+i*.12,n,.35,'triangle',.3)});
  noise(t,.5,.3,3000);
}
/* ---------- controls ---------- */
function start(){
  if(running)return;
  if(left<=0)left=TOTAL;
  $('scene').classList.remove('done');$('msg').textContent='';
  endAt=performance.now()+left*1000;running=true;
  musicOn();raf=requestAnimationFrame(tick);
}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);musicOff()}
function reset(){pause();left=TOTAL;$('scene').classList.remove('done');$('msg').textContent='';show()}
function finish(){
  running=false;musicOff();fanfare();
  $('scene').classList.add('done');$('msg').textContent='انتهى الوقت! 🎉';
}
$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=reset;
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.5};
show();
</script>
