<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسوبي – كيفية عمل جهاز الحاسوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6ff;--card:#fff;--ink:#16324f;--b:#1e88e5;--o:#ff8f1f;--g:#2fb86b;--p:#8e5bd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10243a;--card:#1b3a5a;--ink:#f1f7ff}}
:root[data-theme=dark]{--bg:#10243a;--card:#1b3a5a;--ink:#f1f7ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:20px}
header{position:relative;padding-inline:84px!important;min-height:70px;justify-content:center;background:linear-gradient(#fff,#e3f1ff);color:#0d3b66;display:flex;flex-direction:column;align-items:center;padding:4px 8px;border-bottom:4px solid var(--o);text-align:center;font-weight:800;line-height:1.35;font-size:14px}header .vision{position:absolute;left:6px;top:6px;height:58px;width:auto;border-radius:10px;background:#fff;padding:2px}header .logo{position:absolute;right:6px;top:4px;height:62px;width:auto;border-radius:10px;background:#fff}header div:nth-child(4){font-size:17px;color:#c25e00}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#16324f;color:#fff}:root:not([data-theme=light]) header div:nth-child(4){color:#ffc94d}}

main{flex:1;overflow:auto;padding:14px;display:flex;justify-content:center}
.pg{max-width:900px;width:100%;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:30px;margin:6px 0;color:var(--b)}h2{font-size:24px;margin:6px 0}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 0 #0002;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.chat{display:flex;gap:12px;align-items:center}.chat img{height:130px}
.bub{background:#fff7e0;color:#4a3300;border-radius:20px;padding:12px 16px;flex:1;border:3px solid #ffc94d}
.tile{flex:1 1 150px;max-width:260px;background:var(--card);border:4px solid var(--c,#9cc);border-radius:20px;padding:10px;text-align:center;cursor:pointer;font:inherit;color:inherit;position:relative}
.tile img{height:90px;max-width:100%;object-fit:contain}.tile .e{font-size:54px;line-height:90px}
.tile b{display:block;font-size:19px}.tile .inf{display:none;font-size:17px;margin-top:4px}.tile.open .inf{display:block}
.tile.sel{outline:5px solid var(--o)}.tile.ok{border-color:var(--g);background:#dff8e8;color:#064}.tile.no{border-color:#f5a623;animation:sh .3s}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.bin{flex:1 1 200px;min-height:120px;border:4px dashed var(--c);border-radius:20px;padding:8px;text-align:center;background:var(--card)}
.bin h3{margin:0 0 6px;color:var(--c)}.chip{display:inline-block;background:var(--c);color:#fff;border-radius:14px;padding:4px 12px;margin:3px;font-size:17px}
.fb{min-height:40px;font-weight:800;text-align:center;font-size:21px;margin:6px}
.lv{display:inline-block;font-size:34px;vertical-align:middle}
.btn{border:0;border-radius:18px;padding:8px 14px;font:inherit;font-weight:800;color:#fff;background:var(--b);cursor:pointer;box-shadow:0 4px 0 #0004}
.btn.o{background:var(--o)}.btn.g{background:var(--g)}
nav{display:flex;gap:6px;justify-content:center;padding:6px;background:var(--card);border-top:3px solid var(--b)}
nav button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:14px;font-weight:800;border:0;border-radius:16px;background:var(--b);color:#fff;padding:5px 2px;cursor:pointer;box-shadow:0 3px 0 #0004}
nav button span{font-size:26px;line-height:1.1}nav #snd.on{background:var(--g);animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.07)}}
nav button:disabled{opacity:.4}
footer{display:flex;justify-content:space-between;gap:8px;padding:4px 12px calc(4px + env(safe-area-inset-bottom,0px));font-size:13px;background:#0d3b66;color:#fff}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:46px;font-weight:800;color:#fff;text-shadow:0 3px 8px #000a;z-index:9}
#pop.s{display:flex;animation:in .3s}
#stars{position:fixed;top:70px;left:10px;background:#fff;color:#c47a00;border-radius:20px;padding:2px 12px;font-weight:800;z-index:5;box-shadow:0 2px 0 #0003}
.cert{border:10px double var(--o);border-radius:24px;background:#fffdf3;color:#5a3b00;text-align:center;padding:16px}
.cert input{font:inherit;border:0;border-bottom:3px dotted #5a3b00;background:none;width:60%;text-align:center;color:inherit;font-size:22px}
.unit{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:10px 16px;border:5px solid var(--c);cursor:pointer;margin:10px 0;font:inherit;color:inherit;width:100%;text-align:right;box-shadow:0 4px 0 #0002}.unit .ic{font-size:54px}.unit h2{margin:0;font-size:22px}.lesrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.lesrow .btn{flex:1 1 250px;text-align:right;font-size:18px}
.tb{width:100%;border-collapse:collapse;font-size:18px}.tb th,.tb td{border:2px solid #9bc;padding:6px 10px}.tb th{background:#cfe8ff;color:#16324f}.tb td.nr{direction:ltr;text-align:left}
.ta{width:100%;font:inherit;font-size:20px;border:3px solid #9bc;border-radius:14px;padding:8px;background:#fff;color:#16324f;margin:4px 0}
@media print{header,nav,footer,#stars,.noprint{display:none!important}main{overflow:visible}body{background:#fff}}
@media(max-width:560px){body{font-size:18px}.chat img{height:96px}}
</style></head><body>

const im=k=>`<img src="${IM[k]}" alt="">`;
let inHome=true,selU=-1,i=0,hist=[],score=0,done={},talk=false;
const praise=["⭐ أحسنت!","🌟 رائع!","🏆 إجابة مميزة!","👏 عمل رائع!","🎉 ممتاز!"];
let AC,muted=false;
function tone(f,s,d,ty,v){const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+s;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.18,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function sfx(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
if(k=='ok'){tone(660,0,.15,'triangle');tone(880,.1,.25,'triangle')}
else if(k=='no'){tone(300,0,.18,'sine',.12);tone(240,.14,.25,'sine',.12)}
else{[523,659,784,1047].forEach((f,i)=>tone(f,.3+i*.1,.3,'triangle',.16))}}catch(e){}}
function mute(){muted=!muted;document.getElementById('mu').textContent=muted?'🔕':'🔔'}
function pop(t){const p=document.getElementById('pop');p.textContent=t;p.className='s';setTimeout(()=>p.className='',900)}
function win(k){sfx('win');if(!done[k]){done[k]=1;score++;sc.textContent=score}pop(praise[Math.floor(Math.random()*5)])}
function chat(c,t){return `<div class="chat">${im(c)}<div class="bub">${t}</div></div>`}
function tiles(a){return `<div class="row">`+a.map(x=>`<button class="tile" style="--c:${x.c||'#7bb'}" onclick="this.classList.toggle('open')">${x.i?im(x.i):`<div class="e">${x.e}</div>`}<b>${x.n}</b><div class="inf">${x.t}</div></button>`).join('')+`</div>`}
/* اختيار من متعدد: o=[نص أو صورة,...]، c=الصحيح */
function mc(id,q,o,c,h){return `<div class="card"><h2>${q}</h2><div class="row">`+o.map((x,k)=>`<button class="tile" onclick="pick(this,'${id}',${k==c},'${h}')">${x.i?im(x.i):`<div class="e">${x.e||''}</div>`}<b>${x.n}</b></button>`).join('')+`</div><div class="fb" id="f${id}"></div></div>`}
function pick(b,id,ok,h){const f=document.getElementById('f'+id);if(ok){sfx('ok');b.classList.add('ok');f.textContent='✅ أحسنت! إجابة صحيحة';win(id)}else{sfx('no');b.classList.add('no');f.textContent='💡 حاول مرة أخرى: '+h;setTimeout(()=>b.classList.remove('no'),600)}}
function tf(id,q,ans,h){return `<div class="card"><h2>${q}</h2><div class="row"><button class="btn g" onclick="pick(this,'${id}',${ans},'${h}')">✔ صح</button><button class="btn o" onclick="pick(this,'${id}',${!ans},'${h}')">✖ خطأ</button></div><div class="fb" id="f${id}"></div></div>`}
/* لعبة التصنيف: اضغط العنصر ثم الصندوق أو اسحبه */
const SI=[["scan","الماسح الضوئي",0],["⌨️","لوحة المفاتيح",0],["🖱️","الفأرة",0],["print","الطابعة",2],["🔊","مكبرات الصوت",2],["mon","الشاشة",2],["🧩","المعالج",1],["💾","القرص الصلب",1],["🧠","ذاكرة الحاسوب (RAM)",1]];
const SB=[["أجهزة الإدخال","#1e88e5"],["المعالجة والتخزين","#8e5bd8"],["أجهزة الإخراج","#2fb86b"]];
let selI=null,placed=0;
function sortGame(){placed=0;return `<div class="row" id="items">`+SI.map((x,k)=>`<button class="tile" draggable="true" id="s${k}" ondragstart="event.dataTransfer.setData('t',${k})" onclick="selI=${k};document.querySelectorAll('#items .tile').forEach(t=>t.classList.remove('sel'));this.classList.add('sel')" style="max-width:140px">${IM[x[0]]?im(x[0]):`<div class="e">${x[0]}</div>`}<b>${x[1]}</b></button>`).join('')+`</div><div class="row">`+SB.map((b,k)=>`<div class="bin" style="--c:${b[1]}" onclick="drop(${k},selI)" ondragover="event.preventDefault()" ondrop="drop(${k},+event.dataTransfer.getData('t'))"><h3>${b[0]}</h3></div>`).join('')+`</div><div class="fb" id="fs"></div>`}
function drop(k,s){if(s===null||isNaN(s))return;const el=document.getElementById('s'+s);if(!el||el.dataset.d)return;const f=document.getElementById('fs');
if(SI[s][2]==k){sfx('ok');el.dataset.d=1;el.style.display='none';const bin=document.querySelectorAll('.bin')[k];bin.insertAdjacentHTML('beforeend',`<span class="chip">${SI[s][1]}</span>`);selI=null;f.textContent='✅ مكانه صحيح!';if(++placed==SI.length)win('sort')}else{sfx('no');f.textContent='💡 فكّر: هل يُدخل البيانات؟ أم يعالجها ويخزنها؟ أم يعرض النتائج؟';el.classList.add('no');setTimeout(()=>el.classList.remove('no'),500)}}
/* ترتيب الخطوات */
const ST=["أضغط على حرف في لوحة المفاتيح (إدخال)","يتحقق الحاسوب من الحرف ويضيفه إلى الذاكرة (معالجة)","يظهر الحرف على الشاشة (إخراج)"];
let ord=0;
function orderGame(){ord=0;const sh=[2,0,1];return `<div class="card"><h2>رتّب الخطوات: ماذا يحدث عند كتابة حرف؟</h2><div class="row" id="os">`+sh.map(k=>`<button class="tile" onclick="step(this,${k})"><b>${ST[k]}</b></button>`).join('')+`</div><div class="fb" id="fo"></div></div>`}
function step(b,k){const f=document.getElementById('fo');if(k==ord){sfx('ok');b.classList.add('ok');b.insertAdjacentHTML('afterbegin',`<div class="e" style="font-size:34px;line-height:40px">${ord+1}</div>`);b.disabled=1;f.textContent='✅ أحسنت!';if(++ord==3)win('ord')}else{sfx('no');b.classList.add('no');f.textContent='💡 ابدأ بما يفعله الطفل أولًا ثم ما يفعله الحاسوب ثم ما يظهر.';setTimeout(()=>b.classList.remove('no'),500)}}
const O={};
function ord2(id,t,a){O[id]=0;return `<div class="card"><h2>${t}</h2><div class="row">`+a.map((x,k)=>k).reverse().map(k=>`<button class="tile" style="max-width:130px" onclick="st2(this,'${id}',${k},${a.length})"><b>${a[k]}</b></button>`).join('')+`</div><div class="fb" id="f${id}"></div></div>`}
function st2(b,id,k,n){const f=document.getElementById('f'+id);if(k==O[id]){sfx('ok');b.classList.add('ok');b.disabled=1;f.textContent='✅ أحسنت!';if(++O[id]==n)win(id)}else{sfx('no');b.classList.add('no');f.textContent='💡 فكّر في الترتيب الصحيح من البداية.';setTimeout(()=>b.classList.remove('no'),500)}}
function u1(){return Object.keys(done).filter(k=>!/^[pqrstuvwxyz]\d$/.test(k)&&!/^E/.test(k)).length}

{s:`المستوى الأول. أي أداة تفعل ماذا؟`,h:()=>`<h1><span class="lv">🌱</span> نشاط: طابق الأداة بعملها</h1>${mc('i1','أيُّ أداة تحذف جزءًا من الصورة وتحتفظ بالجزء الذي تحدده؟',[{e:'✂️',n:'القص'},{e:'🔄',n:'التدوير'},{e:'🗑️',n:'الحذف'}],0,'اسحب المقابض حول الجزء المطلوب.')}${mc('i2','أيُّ زر نستخدمه لبدء تسجيل الصوت؟',[{e:'⏺️',n:'بدء التسجيل'},{e:'⏹️',n:'إيقاف التسجيل'},{e:'📤',n:'مشاركة'}],0,'ابدأ بالتسجيل لا بالإيقاف.')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('i3','نستخدم مسجل الصوت (Sound Recorder) لتسجيل الصوت.',true,'اسمه يدل على وظيفته.')}${tf('i4','تدوير الصورة يكون بمقدار 90 درجة في كل مرة.',true,'انقر تدوير (Rotate).')}${tf('i5','نستخدم زر الحذف (Delete) لتكبير الصورة.',false,'التكبير هو Zoom in.')}${mc('i6','بأي تطبيق نعرض الصور ونحررها؟',[{n:'صور مايكروسوفت (Microsoft Photos)'},{n:'مسجل الصوت'},{n:'المتصفح'}],0,'اسمه يشبه كلمة الصور.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات تسجيل الصوت.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('j1','رتّب خطوات تسجيل الصوت',['افتح مسجل الصوت','انقر بدء التسجيل','انقر إيقاف التسجيل','سمِّ الملف باسم مناسب'])}${mc('j2','صورتك فيها شيء زائد في الجانب، وتريد الإبقاء على الوسط. ماذا تفعل؟',[{e:'✂️',n:'أقصّ الصورة'},{e:'🗑️',n:'أحذفها'},{e:'🔄',n:'أدوّرها'}],0,'اختر الأداة التي تُبقي جزءًا وتُزيل الباقي.')}`},
{s:`الدرس الأول نقطة أربعة: تطبيق التأثيرات على الصور. سنجرب عوامل التصفية ونمسح الصور ضوئيًا.`,h:()=>`<div class="card" style="text-align:center"><h1>١ حاسوبي ✨</h1><h2>الدرس 1.4: تطبيقُ التأثيرات على الصور</h2>${chat('girl','هل تريد تغيير ألوان صورك وإضافة تأثيرات جميلة؟')}${chat('boy','وكيف ندخل صورة من الورق إلى الحاسوب؟ هيّا نكتشف!')}<div class="row">${im('scan')}</div></div>`},

{s:`تغيير الألوان والإضاءة بأداة التعديل. السطوع والتباين والظلال والتشبع والدفء.`,h:()=>`<h1>🎨 تعلّم: الألوان والإضاءة</h1>${chat('girl','انقر التعديل (Adjustment) لتغيّر الإضاءة واللون:')}${tiles([{e:'☀️',n:'السطوع (Brightness)',c:'#ff8f1f',t:'يجعل الصورة أفتح أو أغمق.'},{e:'🌗',n:'التباين (Contrast)',c:'#1e88e5',t:'الفرق بين الأجزاء الفاتحة والداكنة.'},{e:'🌑',n:'الظلال (Shadows)',c:'#555',t:'تتحكم في الأجزاء المظللة.'},{e:'🌈',n:'التشبّع (Saturation)',c:'#8e5bd8',t:'يزيد حيوية الألوان أو يقللها.'},{e:'🔥',n:'الدفء (Warmth)',c:'#e53935',t:'يجعل الألوان أدفأ أو أبرد.'},{e:'🖌️',n:'اللون الخفيف (Tint)',c:'#2fb86b',t:'يضيف لمسة لونية خفيفة.'}])}`},
{s:`مسح صورة ضوئيًا بالماسح الضوئي. ضع الصورة، وافتح ويندوز سكان، واختر JPEG، ثم عاين وامسح.`,h:()=>`<h1>🖨️ تعلّم: مسحُ صورة ضوئيًا</h1>${chat('boy','لإدخال الصور أو الرسومات إلى الحاسوب نستخدم الماسح الضوئي. تأكد من توصيل سلك USB.')}${tiles([{e:'1️⃣',n:'ضع الصورة',c:'#1e88e5',t:'ضع الصورة على الماسح الضوئي وأغلق الغطاء.'},{e:'2️⃣',n:'افتح التطبيق',c:'#8e5bd8',t:'افتح تطبيق الماسح الضوئي ويندوز سكان (Windows Scan).'},{e:'3️⃣',n:'اختر JPEG',c:'#ff8f1f',t:'اختر نوع الملف (File type) JPEG.'},{e:'4️⃣',n:'معاينة',c:'#2fb86b',t:'انقر معاينة (Preview) لعرض الصورة قبل المسح.'},{e:'5️⃣',n:'مسح',c:'#e53935',t:'انقر مسح (Scan) ثم احفظ الصورة في المجلد المناسب.'}])}`},

{s:`المستوى الأول. اختر الإجابة الصحيحة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الصورة والأداة</h1>${mc('l1','أيُّ أداة نستخدمها لتغيير الإضاءة والألوان في الصورة؟',[{e:'🎨',n:'التعديل'},{e:'🗑️',n:'الحذف'},{e:'📤',n:'المشاركة'}],0,'اسمها Adjustment.')}${mc('l2','أيُّ جهاز يدخل الصورة الورقية إلى الحاسوب؟',[{i:'scan',n:'الماسح الضوئي'},{i:'print',n:'الطابعة'},{i:'mon',n:'الشاشة'}],0,'جهاز إدخال.')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('l3','يمكنني التراجع عن التغييرات بأمر التراجع (Undo).',true,'يعيد الصورة خطوة للخلف.')}${tf('l4','نختار نوع الملف JPEG قبل المسح الضوئي.',true,'تذكّر خطوات ويندوز سكان.')}${tf('l5','نستخدم زر مسح (Scan) قبل المعاينة (Preview).',false,'نعاين أولًا ثم نمسح.')}${mc('l6','لماذا نحفظ الصورة بنسخة جديدة (Save as copy)؟',[{n:'لتبقى الصورة الأصلية كما هي'},{n:'لنحذف الصورة'},{n:'لنغيّر الاسم فقط'}],0,'نحافظ على الأصل.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات المسح الضوئي.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('m1','رتّب خطوات المسح الضوئي',['افتح تطبيق Windows Scan','اختر نوع الملف JPEG','انقر معاينة (Preview)','انقر مسح (Scan)'])}${mc('m2','ليس معك ماسح ضوئي، ومعك هاتف ذكي. ماذا تفعل؟',[{e:'📲',n:'أمسح بتطبيق وكاميرا الهاتف'},{e:'🗑️',n:'لا أفعل شيئًا'},{e:'🖨️',n:'أطبع الصورة'}],0,'الهاتف يلتقط الصور أيضًا.')}`},

{s:`المؤثرات. يمكن إضافة تأثيرات حركية وثلاثية الأبعاد وصوتية إلى الفيلم.`,h:()=>`<h1>✨ تعلّم: المؤثرات</h1>${chat('girl','اضغط على كل نوع من المؤثرات لتعرف كيف نضيفه:')}${tiles([{e:'💫',n:'تأثيرات حركية',c:'#1e88e5',t:'حدد الصورة التي تريد إضافة التأثير إليها، انقر حركة (Motion)، اختر التأثير المناسب ثم انقر تم (Done).'},{e:'🧊',n:'ثلاثية الأبعاد',c:'#8e5bd8',t:'انقر تأثيرات ثلاثية الأبعاد (3D effects)، اختر التأثير المناسب، مثل الأضواء الملونة (Colored lights)، ثم تم (Done).'},{e:'🎵',n:'تأثيرات صوتية',c:'#2fb86b',t:'انقر موسيقى الخلفية (Background music)، اختر النغمة المناسبة، ثم تم (Done).'}])}`},

{s:`المستوى الأول. اختر الإجابة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الإجابة</h1>${mc('n1','أيُّ تطبيق نستخدمه لإنشاء الفيديو؟',[{n:'الصور القديمة (Photos Legacy)'},{n:'مسجل الصوت'},{n:'المتصفح'}],0,'اسمه فيه كلمة Photos.')}${mc('n2','أيُّ مؤثر يضيف موسيقى إلى الفيلم؟',[{e:'🎵',n:'موسيقى الخلفية'},{e:'🔤',n:'النص'},{e:'🧊',n:'ثلاثي الأبعاد'}],0,'استمع، إنها موسيقى!')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('n3','نسمّي الفيديو قبل إضافة الملفات.',true,'نكتب الاسم ثم نضغط موافق.')}${tf('n4','التأثير الحركي نضيفه من زر Motion.',true,'Motion تعني حركة.')}${tf('n5','نصدّر الفيديو (Export) قبل أن ننهيه.',false,'ننهي الفيديو أولًا.')}${mc('n6','أردت كتابة عنوان على الفيلم. ماذا تستخدم؟',[{e:'🔤',n:'نص (Text)'},{e:'🎵',n:'موسيقى'},{e:'💫',n:'حركة'}],0,'تكتب كلمات.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات صناعة الفيلم.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('o1','رتّب خطوات صناعة الفيلم',['أنشئ مشروع فيديو جديدًا','أضف الصور والمقاطع','أضف المؤثرات والنص','انقر إنهاء الفيديو ثم تصدير'])}${mc('o2','تريد أن يكون فيلمك أجمل. ما أفضل حل؟',[{e:'🎵',n:'أضيف موسيقى ونصًا ومؤثرات مناسبة'},{e:'🗑️',n:'أترك الفيلم بلا إضافات'},{e:'🔇',n:'أحذف كل الصور'}],0,'اختر ما يجذب المشاهدين.')}`},

{s:`الوحدة الثانية: لنعرض أفكارنا. الدرس اثنان نقطة واحد: العروض التقديمية. سنتعلم كيف نخطط لعرض تقديمي وننشئه وننسقه ونحفظه.`,h:()=>`<div class="card" style="text-align:center"><h1>٢ لنعرض أفكارنا 📊</h1><h2>الدرس 2.1: العروضُ التقديمية</h2>${chat('girl','العرض التقديمي وسيلة فعّالة للتعبير عن أفكارنا أمام الجمهور بالنصوص والصور والوسائط المتعددة!')}</div>`},
{s:`التخطيط لإنشاء عرض تقديمي ناجح. اسأل نفسك خمسة أسئلة قبل البدء.`,h:()=>`<h1>📝 اكتشف: خطّط لعرضك التقديمي</h1>${chat('boy','قبل إنشاء العرض عليك التحضير له بالإجابة عن هذه الأسئلة. اضغط على كل بطاقة:')}${tiles([{e:'🎯',n:'ما الهدف؟',c:'#1e88e5',t:'تحديد الهدف يساعدك على تحديد الموضوع الذي ترغب في تقديمه والتحدث عنه.'},{e:'👥',n:'من الجمهور؟',c:'#8e5bd8',t:'تحديد الجمهور يساعدك على إعداد محتوى مناسب لهم.'},{e:'📚',n:'ما المحتوى؟',c:'#2fb86b',t:'تحدد النقاط الرئيسة التي ستتناولها أثناء العرض.'},{e:'🖼️',n:'ما الوسائط؟',c:'#ff8f1f',t:'إضافة الصور ومقاطع الفيديو المناسبة تجعل عرضك جذابًا.'},{e:'⏱️',n:'ما المدة؟',c:'#e53935',t:'تحديد الفترة الزمنية يساعدك على تحديد كمية المحتوى التي ستعرضها.'}])}`},
{s:`تطبيق العروض التقديمية بوريبوينت. نفتح التطبيق ونتعرف على واجهته.`,h:()=>`<h1>💻 تعلّم: تطبيق العروض التقديمية (PowerPoint)</h1>${chat('girl','نفتح التطبيق: انقر زر البدء (Start) ← اختر PowerPoint ← عرض تقديمي فارغ (Blank Presentation).')}${tiles([{e:'🎛️',n:'الشريط (Ribbon)',c:'#1e88e5',t:'مجموعة من التبويبات والأدوات المستخدمة لإنشاء العرض.'},{e:'🖼️',n:'الشريحة (Slide)',c:'#8e5bd8',t:'منطقة العمل التي تضع عليها النصوص والوسائط المتعددة.'},{e:'🗂️',n:'جزء الشرائح (Slides Pane)',c:'#2fb86b',t:'يساعدك على معاينة الشرائح والتنقل بينها.'}])}`},
{s:`إنشاء عرض تقديمي. ندرج شريحة جديدة، ونكتب النص، ونغير السمة.`,h:()=>`<h1>🛠️ تعلّم: إنشاء العرض</h1>${tiles([{e:'➕',n:'إدراج شريحة',c:'#1e88e5',t:'من تبويب الشريط الرئيسي (Home) ومن مجموعة شرائح (Slides) انقر شريحة جديدة (New Slide) واختر التخطيط، مثل العنوان والمحتوى (Title and Content).'},{e:'🔤',n:'إدراج نص',c:'#8e5bd8',t:'انقر داخل مربع النص ثم اكتب. مثال: "النظام الشمسي".'},{e:'🎨',n:'تغيير السمة (Themes)',c:'#ff8f1f',t:'من تبويب تصميم (Design) ومن مجموعة سمة (Themes) اختر السمة المناسبة. ويمكنك تغيير الألوان (Colors) والخطوط (Fonts) وأنماط الخلفية (Background Styles).'}])}`},
{s:`تنسيق النص. ننشئ قائمة، ونستخدم الوورد آرت، ونحذف شريحة.`,h:()=>`<h1>✨ تعلّم: التنسيق والحذف</h1>${tiles([{e:'📋',n:'إنشاء قائمة',c:'#1e88e5',t:'من تبويب الشريط الرئيسي (Home) ومن مجموعة فقرة (Paragraph) انقر رمز القائمة النقطية أو الرقمية، ثم اكتب العناصر.'},{e:'🅰️',n:'تنسيق النص (WordArt)',c:'#8e5bd8',t:'حدد النص، ثم من تبويب تنسيق الشكل (Shape Format) ومن أنماط (WordArt Styles) اختر نمطًا مناسبًا.'},{e:'🗑️',n:'حذف شريحة',c:'#e53935',t:'انقر بزر الفأرة الأيمن على الشريحة واختر حذف الشريحة (Delete Slide)، أو استخدم مفتاح الحذف (Delete).'},{e:'↩️',n:'التراجع (Undo)',c:'#ff8f1f',t:'للتراجع عن حذف شريحة بالخطأ.'}])}`},
{s:`حفظ العرض التقديمي. نحفظ العرض باسم مناسب في مجلد المستندات.`,h:()=>`<h1>💾 تعلّم: حفظ العرض</h1>${chat('boy','لنحفظ عملنا: من تبويب ملف (File) انقر حفظ باسم (Save As).')}${tiles([{e:'1️⃣',n:'حفظ باسم',c:'#1e88e5',t:'من تبويب ملف (File) انقر حفظ باسم (Save As) ثم هذا الكمبيوتر (This PC).'},{e:'2️⃣',n:'اختر المكان',c:'#8e5bd8',t:'اختر مجلد المستندات (Documents) أو الموقع الذي تريد حفظ الملف فيه.'},{e:'3️⃣',n:'اكتب الاسم',c:'#ff8f1f',t:'في مربع اسم الملف (File name) اكتب اسمًا مناسبًا، ثم انقر حفظ (Save).'},{e:'📊',n:'الامتداد .pptx',c:'#e53935',t:'امتداد ملف العرض التقديمي هو pptx.'}])}`},
{s:`المستوى الأول. اختر الإجابة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الإجابة</h1>${mc('p1','أيُّ تطبيق نستخدمه لإنشاء العروض التقديمية؟',[{e:'📊',n:'PowerPoint'},{e:'🎙️',n:'مسجل الصوت'},{e:'🌐',n:'المتصفح'}],0,'اسمه يبدأ بـ Power.')}${mc('p2','ما امتداد ملف العرض التقديمي؟',[{n:'.pptx'},{n:'.mp3'},{n:'.jpg'}],0,'تذكّر درس امتداد الملفات.')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('p3','تحديد الجمهور يساعدنا على إعداد محتوى مناسب لهم.',true,'نفكر فيمن سيشاهد العرض.')}${tf('p4','نغيّر السمة من تبويب تصميم (Design).',true,'اسمه Design.')}${tf('p5','نستخدم زر Undo لإضافة شريحة جديدة.',false,'Undo للتراجع.')}${mc('p6','أردت تغيير شكل خلفية الشرائح كلها. ماذا تستخدم؟',[{e:'🎨',n:'السمات (Themes)'},{e:'🗑️',n:'حذف شريحة'},{e:'💾',n:'حفظ'}],0,'من تبويب تصميم.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات إنشاء العرض.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('q1','رتّب خطوات إنشاء العرض التقديمي',['افتح PowerPoint واختر عرضًا فارغًا','اكتب العنوان وأضف الشرائح','نسّق النص واختر السمة','احفظ العرض باسم مناسب'])}${mc('q2','عرضك طويل جدًا والوقت قصير. ما أفضل حل؟',[{e:'✂️',n:'أختصر المحتوى وأبقي النقاط الرئيسة'},{e:'🐢',n:'أتكلم ببطء شديد'},{e:'➕',n:'أضيف شرائح أكثر'}],0,'فكّر في مدة العرض.')}`},
{s:`الدرس اثنان نقطة اثنان: التعامل مع الصور. سندمج الصور مع النصوص في العرض التقديمي.`,h:()=>`<div class="card" style="text-align:center"><h1>٢ لنعرض أفكارنا 🖼️</h1><h2>الدرس 2.2: التعاملُ مع الصور</h2>${chat('boy','يمكنك دمج الصور مع النصوص في العرض التقديمي لدعم أفكارك وجذب انتباه الجمهور!')}<div class="row" style="font-size:60px">🪐🌍☀️</div></div>`},
{s:`فتح عرض تقديمي محفوظ. من ملف، افتح، استعراض.`,h:()=>`<h1>📂 تعلّم: فتح العرض التقديمي</h1>${chat('girl','لفتح العرض التقديمي (pptx) المحفوظ سابقًا:')}${tiles([{e:'1️⃣',n:'تبويب ملف',c:'#1e88e5',t:'من تبويب ملف (File) اختر فتح (Open).'},{e:'2️⃣',n:'استعراض',c:'#8e5bd8',t:'انقر استعراض (Browse)، ثم حدد موقع العرض التقديمي.'},{e:'3️⃣',n:'اختر العرض',c:'#ff8f1f',t:'اختر عرضك التقديمي، ثم انقر فتح (Open).'}])}`},
{s:`إدراج صورة. من إدراج، صور، من هذا الجهاز، ثم اختر الصورة.`,h:()=>`<h1>🖼️ تعلّم: إدراجُ الصور</h1>${chat('boy','يمكنك إدراج صور في عرضك التقديمي وإضافة أنماط وتنسيقات مختلفة إليها.')}${tiles([{e:'1️⃣',n:'حدد الشريحة',c:'#1e88e5',t:'حدد الشريحة التي تريد إدراج الصورة إليها.'},{e:'2️⃣',n:'تبويب إدراج',c:'#8e5bd8',t:'من تبويب إدراج (Insert) ومن مجموعة صور (Images) انقر صور (Pictures).'},{e:'3️⃣',n:'هذا الجهاز',c:'#ff8f1f',t:'من النافذة اختر هذا الجهاز (This Device).'},{e:'4️⃣',n:'اختر الصورة',c:'#2fb86b',t:'ابحث عن موقع الصورة، مثل مجلد الصور (Pictures)، واختر الصورة.'},{e:'5️⃣',n:'إدراج',c:'#e53935',t:'انقر إدراج (Insert) ليتم إدراج الصورة في الشريحة.'}])}<div class="card">💡 يمكنك استخدام الكاميرا الرقمية أو مسح صورة ثم نقلها إلى الحاسوب وإدراجها.</div>`},
{s:`تغيير حجم الصورة وتنسيقها. نسحب مقبض الزاوية، ونختار نمطًا من تنسيق الصورة.`,h:()=>`<h1>📐 تعلّم: حجم الصورة وتنسيقها</h1>${tiles([{e:'↔️',n:'تغيير الحجم',c:'#1e88e5',t:'حدد الصورة، ثم ضع المؤشر فوق إحدى مقابض الزوايا الأربع، فيتحول إلى سهم مزدوج، واسحب حتى تحصل على الحجم المناسب.'},{e:'🖼️',n:'نمط الصورة',c:'#8e5bd8',t:'حدد الصورة، ثم من تبويب تنسيق الصورة (Picture Format) ومن مجموعة أنماط الصورة (Picture Styles) اختر نمطًا، مثل أبيض مستدير (Rotated White).'},{e:'🅰️',n:'تنسيق النص',c:'#ff8f1f',t:'يمكنك أيضًا تنسيق النص بخطوط وأنماط WordArt مختلفة.'}])}<div class="card">💡 إذا ظهر لك تبويب تنسيق الصورة (Picture Format) فهذا يعني أنك حددت الصورة.</div>`},
{s:`المستوى الأول. اختر الإجابة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الإجابة</h1>${mc('r1','من أيّ تبويب ندرج صورة في الشريحة؟',[{n:'إدراج (Insert)'},{n:'تصميم (Design)'},{n:'ملف (File)'}],0,'نريد إدراج صورة.')}${mc('r2','أيّ تبويب يظهر عند تحديد الصورة؟',[{n:'تنسيق الصورة (Picture Format)'},{n:'مراجعة'},{n:'عرض'}],0,'اسمه يشبه عمله.')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('r3','لفتح عرض محفوظ نختار فتح (Open) من تبويب ملف.',true,'تبويب ملف.')}${tf('r4','نسحب مقبض الزاوية لتغيير حجم الصورة.',true,'المقبض في زاوية الصورة.')}${tf('r5','نختار الصورة من هذا الجهاز (This Device) عند الإدراج من ملف على الحاسوب.',true,'الصورة محفوظة في جهازنا.')}${mc('r6','ماذا نستخدم لإضافة إطار أبيض حول الصورة؟',[{e:'🖼️',n:'أنماط الصورة'},{e:'🗑️',n:'حذف الشريحة'},{e:'💾',n:'حفظ'}],0,'من تبويب تنسيق الصورة.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات إدراج صورة.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('s1','رتّب خطوات إدراج صورة',['حدد الشريحة','تبويب إدراج ← صور','اختر هذا الجهاز ثم الصورة','انقر إدراج'])}${mc('s2','الصورة كبيرة جدًا على الشريحة. ماذا تفعل؟',[{e:'↔️',n:'أسحب مقبض الزاوية لأصغّرها'},{e:'🗑️',n:'أحذف الشريحة'},{e:'💾',n:'أحفظ العرض فقط'}],0,'غيّر الحجم.')}`},
{s:`الدرس اثنان نقطة ثلاثة: التأثيرات الانتقالية والحركية. سنجعل عرضنا أكثر جاذبية.`,h:()=>`<div class="card" style="text-align:center"><h1>٢ لنعرض أفكارنا 🎞️</h1><h2>الدرس 2.3: التأثيراتُ الانتقالية والحركية</h2>${chat('girl','هل تريد أن تنتقل الشرائح بحركة جميلة، وأن تتحرك الصور والعناوين؟')}${chat('boy','هيّا نتعلم التأثيرات ثم نقدّم العرض أمام الصف!')}</div>`},
{s:`التأثيرات الانتقالية. هي تأثيرات تظهر عند الانتقال من شريحة إلى أخرى.`,h:()=>`<h1>🔀 تعلّم: التأثيراتُ الانتقالية (Transitions)</h1>${tiles([{e:'1️⃣',n:'حدد الشريحة',c:'#1e88e5',t:'حدد الشريحة التي تريد تطبيق التأثير عليها.'},{e:'2️⃣',n:'تبويب الانتقالات',c:'#8e5bd8',t:'انقر تبويب الانتقالات (Transitions)، ثم من مجموعة الانتقال إلى هذه الشريحة (Transition to This Slide) اختر التأثير، مثل ستائر (Curtains).'},{e:'👁️',n:'معاينة (Preview)',c:'#2fb86b',t:'لرؤية التأثير قبل العرض.'},{e:'📚',n:'تطبيق على الكل',c:'#ff8f1f',t:'لتطبيق التأثير على جميع الشرائح: من مجموعة التوقيت (Timing) انقر تطبيق على الكل (Apply to All).'}])}`},
{s:`التأثيرات الحركية. نحرّك العناصر داخل الشريحة مثل النص والصورة.`,h:()=>`<h1>💫 تعلّم: التأثيراتُ الحركية (Animations)</h1>${chat('boy','تُضفي التأثيرات الحركية الحيوية على النصوص والصور والأشكال.')}${tiles([{e:'1️⃣',n:'حدد العنصر',c:'#1e88e5',t:'حدد العنصر الذي تريد إضافة تأثير حركي إليه.'},{e:'2️⃣',n:'تبويب حركات',c:'#8e5bd8',t:'من تبويب حركات (Animations) انقر التأثير المناسب، مثل تلاشي (Fade In).'},{e:'👁️',n:'معاينة',c:'#2fb86b',t:'انقر معاينة (Preview) لرؤية التأثير.'}])}<div class="card">💡 لا تكثر من التأثيرات حتى لا يتشتت الجمهور.</div>`},
{s:`ترتيب الشرائح وملاحظات المتحدث. نسحب الشريحة إلى مكانها الصحيح.`,h:()=>`<h1>🗂️ تعلّم: ترتيب الشرائح</h1>${tiles([{e:'🖱️',n:'غيّر الترتيب',c:'#1e88e5',t:'من جزء الشرائح انقر الشريحة واسحبها إلى المكان الذي تريده.'},{e:'📝',n:'ملاحظات (Notes)',c:'#8e5bd8',t:'اكتب ما تريد أن تتذكره أثناء العرض في منطقة الملاحظات.'},{e:'📖',n:'عرض الشرائح',c:'#ff8f1f',t:'للتأكد من ترتيبها الصحيح قبل العرض.'}])}`},
{s:`تقديم العرض. من تبويب عرض الشرائح نبدأ من البداية، ونضغط مفتاح الهروب للخروج.`,h:()=>`<h1>🎤 تعلّم: تقديمُ العرض</h1>${chat('girl','بعد الانتهاء من إعداد العرض والتدرب عليه، يمكنك تقديمه لجمهورك.')}${tiles([{e:'▶️',n:'ابدأ من البداية',c:'#2fb86b',t:'انقر تبويب عرض الشرائح (Slide Show)، ثم من البداية (From Beginning).'},{e:'➡️',n:'انتقل بين الشرائح',c:'#1e88e5',t:'استخدم مفتاحي السهمين أو زر الفأرة للانتقال.'},{e:'⎋',n:'الخروج',c:'#e53935',t:'اضغط مفتاح الهروب (Esc) لإنهاء العرض.'}])}`},

{s:`المستوى الأول. اختر الإجابة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الإجابة</h1>${mc('t1','أيّ تبويب نستخدمه لإضافة تأثير عند الانتقال بين الشرائح؟',[{n:'الانتقالات (Transitions)'},{n:'تصميم'},{n:'إدراج'}],0,'اسمه يدل على الانتقال.')}${mc('t2','أيّ مفتاح نضغطه للخروج من عرض الشرائح؟',[{n:'Esc'},{n:'Delete'},{n:'Save'}],0,'مفتاح الهروب.')}`},
{s:`المستوى الثاني. صح أم خطأ.`,h:()=>`<h1><span class="lv">🌿</span> نشاط: صحّ أم خطأ؟</h1>${tf('t3','التأثير الحركي نضيفه من تبويب حركات (Animations).',true,'اسمه Animations.')}${tf('t4','نكثر من التأثيرات في كل شريحة لنجذب الجمهور.',false,'الكثرة تشتت الانتباه.')}${tf('t5','نستخدم تطبيق على الكل (Apply to All) لنطبق الانتقال على جميع الشرائح.',true,'من مجموعة التوقيت.')}${mc('t6','أيّ سلوك من سلوك المقدّم الجيد؟',[{e:'🗣️',n:'أتكلم بوضوح'},{e:'🙈',n:'لا أنظر إلى الجمهور'},{e:'🤐',n:'أتكلم بصوت منخفض جدًا'}],0,'نريد أن يسمعنا الجميع.')}`},
{s:`المستوى الثالث. تحدي الأبطال. رتب خطوات تقديم العرض.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('u1','رتّب خطوات تقديم العرض',['أرتب الشرائح وأتدرب','تبويب عرض الشرائح ← من البداية','أنتقل بين الشرائح بالأسهم','أضغط Esc لإنهاء العرض'])}${mc('u2','شرائحك فيها نصوص كثيرة وتأثيرات كثيرة. ما أفضل حل؟',[{e:'✂️',n:'أقلل النصوص والتأثيرات'},{e:'➕',n:'أزيد التأثيرات'},{e:'📝',n:'أكتب نصوصًا أطول'}],0,'البساطة أوضح.')}`},
{s:`الدرس اثنان نقطة أربعة: المشروع. تعاون مع مجموعة من زملائك لإنشاء عرض تقديمي عن الغذاء الصحي.`,h:()=>`<div class="card" style="text-align:center"><h1>٢ لنعرض أفكارنا 🏅</h1><h2>الدرس 2.4: المشروع</h2>${chat('girl','تعاون مع مجموعة من زملائك في الصف لإنشاء عرض تقديمي عن الغذاء الصحي 🍎🥦')}${chat('boy','تذكّر أن تستخدم جميع المهارات التي تعلمتها حتى الآن، وكن مبدعًا ومميزًا!')}</div>`},
{s:`خطوات المشروع الست. اضغط على كل خطوة.`,h:()=>`<h1>📋 خطوات المشروع</h1>${tiles([{e:'1️⃣',n:'اجمع المعلومات',c:'#1e88e5',t:'اعثر على معلومات عن الغذاء الصحي.'},{e:'2️⃣',n:'اختر النسق',c:'#8e5bd8',t:'اختر نسقًا مناسبًا للموضوع.'},{e:'3️⃣',n:'أضف النصوص والصور',c:'#2fb86b',t:'أضف نصًا إلى الشرائح التي تحتوي على صور لعرض أي معلومات إضافية.'},{e:'4️⃣',n:'أكمل الشرائح',c:'#ff8f1f',t:'أضف صورًا إلى الشرائح التي تحتوي على نص فقط لتمثيله بطريقة مرئية.'},{e:'5️⃣',n:'أضف التأثيرات',c:'#e53935',t:'أضف تأثيرات حركية للصور والنصوص، وتأثيرات انتقالية بين الشرائح.'},{e:'6️⃣',n:'الشريحة الختامية',c:'#1e88e5',t:'أنشئ شريحة ختامية تلخص عرضك التقديمي.'}])}`},
{s:`برامج أخرى. يمكنك إنشاء العروض التقديمية بتطبيقات أخرى.`,h:()=>`<h1>🧰 برامج أخرى</h1>${tiles([{e:'🍏',n:'Apple Keynote',c:'#1e88e5',t:'لتقديم عرض سريع على جهاز آيباد (iPad) أو آيفون (iPhone) يمكنك استخدام كي نوت (Keynote).'},{e:'📑',n:'LibreOffice Impress',c:'#2fb86b',t:'إن لم يكن لديك PowerPoint فاستخدم ليبر أوفيس إمبريس، وهو يشبهه إلى حد كبير وكلاهما سهل الاستخدام.'}])}`},
{s:`تحدي الأبطال. رتب خطوات المشروع، وأجب عن الأسئلة.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي المشروع</h1>${ord2('v1','رتّب خطوات المشروع',['أجمع معلومات عن الغذاء الصحي','أختار نسقًا مناسبًا','أضيف النصوص والصور','أضيف التأثيرات وأنشئ الشريحة الختامية'])}${tf('v2','أتعاون مع زملائي في المجموعة لإنشاء المشروع.',true,'المشروع جماعي.')}${mc('v3','أيّ برنامج يشبه PowerPoint ويمكن استخدامه بدلًا منه؟',[{e:'📑',n:'LibreOffice Impress'},{e:'🎙️',n:'مسجل الصوت'},{e:'🖨️',n:'Windows Scan'}],0,'برنامج عروض تقديمية آخر.')}`},
{s:`في الختام. مخرجات التعلم. ضع علامة أمام ما أصبحت قادرًا على فعله.`,h:()=>`<h1>🎓 في الختام: مخرجات التعلّم</h1><p>بعد تعلّمي للوحدة، أستطيع أن:</p><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أخطّط لعرض تقديمي وأنشئه وأقدّمه.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أنشئ عنوانًا وأنسّق قائمة.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أغيّر نسق العرض التقديمي.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أدرج صورة وأنسّقها.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أطبّق التأثيرات الانتقالية والحركية على الشرائح.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أضيف شريحة وأحذف شريحة.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أعيد ترتيب الشرائح.</label><label class="card" style="display:block;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> أتبع الإرشادات لتقديم عرض ناجح.</label>`},
{s:`مراجعة الوحدة. أحسنت!`,h:()=>`<h1>✅ مراجعة: لنعرض أفكارنا</h1><div class="card" style="text-align:center">${chat('girl',`أحسنت! جمعتَ ⭐ ${u2()} نجمة من أصل 27.`)}<h2>${u2()>=23?'🏆 مصمم عروض بارع!':u2()>=14?'🌟 رائع، تقدّمتَ كثيرًا!':'💪 جرّب الأنشطة مرة أخرى لتجمع نجومًا أكثر.'}</h2></div><div class="card"><b>تذكّر:</b> التأثيرات الانتقالية بين الشرائح والحركية للعناصر، ونقدّم العرض بثقة ووضوح. وندرج الصور من تبويب إدراج وننسقها من تنسيق الصورة. ونخطط للعرض (الهدف، الجمهور، المحتوى، الوسائط، المدة)، ثم ننشئ الشرائح وننسق النص ونحفظ الملف بامتداد pptx.</div>`},
{s:`شهادة إنجاز. أحسنت! لقد أتممت هذه الوحدة بنجاح وتميز.`,h:()=>cert('لنعرض أفكارنا: العروضُ التقديمية والصور والمشروع (2.1 – 2.4)')},
{s:`الوحدة الثالثة: عالمي المتصل. الدرس ثلاثة نقطة واحد: البريد الإلكتروني. سنتعلم استخدام البريد الإلكتروني بأمان وكتابة رسالة.`,h:()=>`<div class="card" style="text-align:center"><h1>٣ عالمي المتصل 🌍</h1><h2>الدرس 3.1: البريدُ الإلكتروني 📧</h2>${chat('girl','سأرسل ملف العرض التقديمي لصديقي، هل يمكنك مساعدتي؟')}${chat('boy','نعم! يمكننا استخدام البريد الإلكتروني لإرسال الملفات والرسائل إلى أي مكان في العالم!')}</div>`},
{s:`ما البريد الإلكتروني؟ وسيلة لإرسال واستقبال الرسائل عبر شبكة الإنترنت. ومن مزاياه أنه مجاني وسريع.`,h:()=>`<h1>📧 اكتشف: ما البريد الإلكتروني (Email)؟</h1>${chat('boy','وسيلة لإرسال واستقبال الرسائل الإلكترونية عبر شبكة الإنترنت. يمكن إرفاق أنواع مختلفة من الملفات الرقمية وإرسالها لتصل في أي مكان في العالم.')}<h2>⭐ مزايا البريد الإلكتروني</h2>${tiles([{e:'🆓',n:'خدمة مجانية',c:'#2fb86b',t:'الخدمة مجانية.'},{e:'📎',n:'إرفاق الملفات',c:'#1e88e5',t:'يمكن إرفاق الملفات بالرسالة.'},{e:'🌍',n:'التواصل مع العالم',c:'#8e5bd8',t:'التواصل مع الأشخاص حول العالم.'},{e:'⚡',n:'سرعة التبادل',c:'#ff8f1f',t:'سرعة تبادل الرسائل.'},{e:'👥',n:'عدة مستلمين',c:'#e53935',t:'الوصول إلى أكثر من مستلم في الوقت نفسه.'}])}`},
{s:`عنوان البريد الإلكتروني. يتكون من اسم المستخدم، ثم الرمز آت، ثم اسم الجهة المزوّدة للخدمة.`,h:()=>`<h1>🏷️ تعلّم: عنوانُ البريد الإلكتروني</h1><div class="card" style="text-align:center;font-size:30px;direction:ltr"><span style="color:#e53935">ahmed</span><span style="color:#ff8f1f">@</span><span style="color:#1e88e5">edu.moe.om</span></div>${tiles([{e:'1️⃣',n:'اسم المستخدم',c:'#e53935',t:'اسم خاص يميّزك عن غيرك من المستخدمين.'},{e:'2️⃣',n:'الرمز @',c:'#ff8f1f',t:'الرمز (@) جزء رئيس في العنوان، يفصل بين اسم المستخدم وبقية أجزاء العنوان.'},{e:'3️⃣',n:'اسم الجهة المزوّدة',c:'#1e88e5',t:'اسم الجهة التي توفّر خدمة البريد الإلكتروني.'}])}${chat('girl','يجب أن يكون لكل مستخدم عنوان بريد إلكتروني خاص به، ويجب كتابته بطريقة صحيحة.')}`},
{s:`قواعد كتابة رسالة البريد الإلكتروني. من، إلى، عنوان الرسالة، التحية، نص الرسالة، عبارة ختامية، ثم الاسم.`,h:()=>`<h1>✍️ تعلّم: كتابةُ رسالة بريد إلكتروني</h1>${tiles([{e:'📤',n:'من (From)',c:'#1e88e5',t:'عنوان بريدك الإلكتروني.'},{e:'📥',n:'إلى (To)',c:'#8e5bd8',t:'عنوان بريد المستلم.'},{e:'🏷️',n:'الموضوع (Subject)',c:'#e53935',t:'اكتب عنوانًا مناسبًا يصف محتوى الرسالة.'},{e:'👋',n:'التحية',c:'#ff8f1f',t:'ابدأ بتحية، مثل: السلام عليكم ورحمة الله وبركاته.'},{e:'📝',n:'نص الرسالة',c:'#2fb86b',t:'اكتب محتوى الرسالة على شكل فقرات قصيرة، وبعبارات واضحة ومهذبة.'},{e:'🙏',n:'عبارة ختامية',c:'#1e88e5',t:'مثل: مع الشكر، مع الاحترام، مع التقدير. ثم اكتب اسمك.'},{e:'📎',n:'المرفقات',c:'#8e5bd8',t:'يمكنك إرفاق الملفات إذا دعت الحاجة.'}])}`},

{s:`المستوى الأول. اختر الإجابة.`,h:()=>`<h1><span class="lv">🌱</span> نشاط: اختر الإجابة</h1>${mc('w1','أيّ عنوان بريد إلكتروني صحيح؟',[{n:'qais@omantel.om'},{n:'om.qais@omantel'},{n:'omantel.om@qais'}],0,'اسم المستخدم ثم @ ثم اسم الجهة.')}${mc('w2','أيّ ميزة من مزايا البريد الإلكتروني؟',[{e:'📎',n:'إرفاق الملفات'},{e:'🐢',n:'بطء تبادل الرسائل'},{e:'💸',n:'خدمة باهظة الثمن'}],0,'يمكنك إرسال ملف مع الرسالة.')}`},

{s:`المستوى الثالث. تحدي الأبطال. رتب أجزاء الرسالة.`,h:()=>`<h1><span class="lv">🌳</span> تحدّي الأبطال</h1>${ord2('x1','رتّب أجزاء رسالة البريد الإلكتروني',['الموضوع (Subject)','التحية','نص الرسالة','العبارة الختامية والاسم'])}${mc('x2','وصلتك رسالة تقول إنك ربحت جائزة وتطلب بياناتك. ما أفضل تصرف؟',[{e:'🛡️',n:'أتجاهلها وأطلب مساعدة معلمي'},{e:'📝',n:'أكتب بياناتي'},{e:'🔗',n:'أضغط على الرابط'}],0,'قد تكون رسالة احتيالية.')}`},

function go(n,nb){if(n<0||n>=P.length)return;stopS();if(!nb)hist.push(inHome?'h':i);inHome=false;i=n;pg.innerHTML=P[i].h();rcInject();liInject();pv.disabled=i==0;nx.disabled=i==P.length-1;document.querySelector('main').scrollTop=0}
function back(){if(!hist.length)return;const x=hist.pop();x==='h'?home(undefined,1):go(x,1)}
function stopS(){talk=false;try{speechSynthesis.cancel()}catch(e){}snd.classList.remove('on')}
let vs=[];function loadV(){try{vs=speechSynthesis.getVoices()}catch(e){}}loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pickV(){const ar=vs.filter(v=>/^ar/i.test(v.lang));return ar.find(v=>/laila|hoda|salma|zariyah|amira|female|zeina|hala|noura|fatima|sana/i.test(v.name))||ar.find(v=>!/maged|naayf|hamed|tarik|male|shakir|hamza/i.test(v.name))||ar[0]}
function pageText(){const c=pg.cloneNode(true);c.querySelectorAll('.nr').forEach(e=>e.remove());return c.textContent.replace(/\([A-Za-z0-9 \-\.&@\/]+\)/g,' ').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u20E3]/gu,' ').replace(/\s+/g,' ').trim()}
function speak(){if(talk){stopS();return}try{const raw=(pageText().match(/[^.!؟?:]+[.!؟?:]?/g)||[]).map(s=>s.trim()).filter(s=>s.length>1);const q=[];let c='';raw.forEach(s=>{if((c+' '+s).length>160&&c){q.push(c);c=s}else c=(c?c+' ':'')+s});if(c)q.push(c);
talk=true;snd.classList.add('on');speechSynthesis.cancel();const nxt=()=>{if(!talk)return;const s=q.shift();if(!s){stopS();return}const u=new SpeechSynthesisUtterance(s);u.lang='ar-SA';const v=pickV();if(v)u.voice=v;u.rate=.85;u.pitch=1.25;u.onend=nxt;u.onerror=()=>{talk=false;snd.classList.remove('on')};speechSynthesis.speak(u)};nxt()}catch(e){stopS();pop('🔇')}}
