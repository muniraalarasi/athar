<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة أثر · لوحة المعلم</title>
<meta name="theme-color" content="#163f52">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>try{var z=localStorage.getItem("athar-zoom");if(z)document.documentElement.style.setProperty("--zoom",z);}catch(e){}try{var t=localStorage.getItem("athar-tone");document.documentElement.dataset.tone=/^(iris|sky|green|orange|purple)$/.test(t)?t:"iris";}catch(e){document.documentElement.dataset.tone="iris";}</script>
<style>
:root{--fsk:1.25}            /* نفس حجم خط منصة أثر: 20px بدل 16px */
@media(max-width:760px){:root{--fsk:1.19}}
body{zoom:var(--zoom,1)}   /* يتبع إعداد «حجم الخط» في منصة أثر */
@media (max-width:900px){aside nav{gap:4px;padding-bottom:4px;scrollbar-width:thin}aside nav button{flex:none}aside nav .side-sep{display:none}}
@media (max-width:600px){.row{flex-wrap:wrap}.row .grow{flex:1 1 150px;min-width:0}.top{gap:10px}}

/* بصمة أثر: لوحة معلم بهوية منصة أثر (أخضر مزرق + ذهبي)، البيانات على جهاز المعلم */
:root{--ink:#16303b;--muted:#5a7380;--page:#eef3f4;--paper:#fff;--soft:#f3f7f8;--line:#dbe6e9;--teal:#163f52;--teal2:#225c78;--tsoft:#e4eff3;--gold:#d9a64e;--gsoft:#f8eed8;--good:#1f8a4c;--gdsoft:#e6f5ec;--bad:#b3261e;--bdsoft:#fdecea;--warn:#9a6200;--wsoft:#fdf3e1;--r:16px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{font-family:"Cairo",Tahoma,sans-serif;background:var(--page);color:var(--ink);font-size:calc(16px * var(--fsk));line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.4}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(170deg,var(--teal),var(--deep));color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.brand img{width:46px;height:46px;border-radius:50%;background:#f7f3ee;box-shadow:0 0 0 2px var(--gold)}
.brand b{display:block;font-size:calc(19px * var(--fsk))}.brand small{opacity:.8;font-size:calc(12.5px * var(--fsk))}
aside nav{display:flex;flex-direction:column;gap:3px}
aside nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#e8f1f4;text-align:start;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;min-height:44px}
aside nav button:hover{background:rgba(255,255,255,.08)}
aside nav button[aria-current=page]{background:var(--gold);color:var(--gink)}
aside nav .ic{opacity:.95}
.side-foot{margin-top:auto;font-size:calc(13px * var(--fsk));opacity:.85}
.side-foot a{color:#fff}
main{padding:22px 26px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:calc(26px * var(--fsk))}.top p{margin:0;color:var(--muted);font-size:calc(14px * var(--fsk))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal2)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.gold{background:var(--gold);color:var(--gink);border-color:var(--gold)}
.btn.s{padding:4px 12px;min-height:34px;font-size:calc(14px * var(--fsk))}
.btn.bad{color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .v{font-size:calc(32px * var(--fsk));font-weight:800;color:var(--teal);line-height:1.2}.kpi .l{color:var(--muted);font-size:calc(14px * var(--fsk))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card h2{font-size:calc(18px * var(--fsk));margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.muted{color:var(--muted)}.sm{font-size:calc(14px * var(--fsk))}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--tsoft);color:var(--teal);flex:none}
.grow{flex:1}
.pill{font-size:calc(12.5px * var(--fsk));font-weight:700;padding:1px 10px;border-radius:999px;background:var(--tsoft);color:var(--teal);white-space:nowrap}
.pill.g{background:var(--gdsoft);color:var(--good)}.pill.b{background:var(--bdsoft);color:var(--bad)}.pill.w{background:var(--wsoft);color:var(--warn)}.pill.gold{background:var(--gsoft);color:var(--gink2)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:calc(17px * var(--fsk))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-height:42px}
textarea{min-height:120px;width:100%;resize:vertical}
.cls{display:flex;flex-direction:column;gap:6px}
.cls h3{font-size:calc(19px * var(--fsk))}
.att button{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.att button[aria-pressed=true].p{background:var(--good);color:#fff;border-color:var(--good)}
.att button[aria-pressed=true].a{background:var(--bad);color:#fff;border-color:var(--bad)}
.att button[aria-pressed=true].l{background:var(--gold);color:var(--gink);border-color:var(--gold)}
.ptiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pt{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.pt .sc{font-size:calc(26px * var(--fsk));font-weight:800;color:var(--teal)}
.pt .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.lvl{font-size:calc(13px * var(--fsk))}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:calc(12px * var(--fsk));color:var(--muted)}
.bars span{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--teal2));border-radius:8px 8px 3px 3px;min-height:3px}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{text-align:center;padding:14px 8px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.step .e{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 6px;color:#fff}.step .e .ic{width:30px;height:30px}.step b{display:block}.step small{color:var(--muted)}
.prog{height:10px;border-radius:6px;background:var(--tsoft);overflow:hidden}.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold))}
dialog{border:0;border-radius:20px;padding:0;max-width:520px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,30,40,.5)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.db{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.db label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:calc(14px * var(--fsk))}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:calc(20px * var(--fsk))}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.toast.show{opacity:1}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.lg{width:26px;height:26px}.ic.xl{width:40px;height:40px;stroke-width:1.6}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.rank.r1{background:linear-gradient(135deg,#e6b85c,#b8862b)}.rank.r2{background:linear-gradient(135deg,#b9c4cc,#8796a1)}.rank.r3{background:linear-gradient(135deg,#d39a6a,#a5673b)}.rank.r4,.rank.r5{background:var(--tsoft);color:var(--teal)}
.card h2 .ic{color:var(--teal2)}
.side-sep{font-size:calc(12px * var(--fsk));opacity:.7;padding:10px 12px 2px;font-weight:700}
.rbtn{width:38px;height:36px;padding:0;justify-content:center}
.lv{display:inline-flex;align-items:center;gap:5px;font-size:calc(12.5px * var(--fsk));font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.lv .ic{width:15px;height:15px}
.rpill{display:inline-flex;align-items:center;gap:5px}.rpill .ic{width:15px;height:15px}
/* وضع الحصة */
#cm{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,var(--deep),var(--teal) 60%,var(--teal2));color:#fff;display:none;flex-direction:column;padding:18px 24px;overflow:auto}
#cm.on{display:flex}
.cm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cm-top h2{font-size:calc(24px * var(--fsk))}
.cm-tabs{display:flex;gap:6px;flex-wrap:wrap}
.cm-tabs button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;min-height:44px}
.cm-tabs button[aria-pressed=true]{background:var(--gold);color:var(--gink);border-color:var(--gold)}
.cm-body{flex:1;display:grid;place-items:center;padding:20px 0}
.big{font-size:clamp(48px,10vw,120px);font-weight:800;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.cm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.cm-btns .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3);font-size:calc(18px * var(--fsk))}
.cm-btns .btn.gold{background:var(--gold);color:var(--gink)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;max-width:1100px}
.groups .card{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.groups h3{color:var(--gold)}
.cm-pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:1200px}
.cm-pts button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:12px;cursor:pointer;font-weight:700;min-height:70px}
.cm-pts button b{display:block;font-size:calc(22px * var(--fsk));color:var(--gold)}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}aside nav{flex-direction:row;overflow-x:auto}aside nav button{white-space:nowrap}.side-foot{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:1fr}.path{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:16px 14px 50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== ألوان بصمة أثر تتبع مظهر منصة أثر ===== */
:root[data-tone]{--teal:#163f52;--teal2:#225c78;--tsoft:#e4eff3;--gold:#d9a64e;--gsoft:#f8eed8;--deep:#0f2e3d;--gink:#3a2806;--gink2:#7a5410;--ink:#16303b;--muted:#5a7380;--page:#eef3f4;--soft:#f3f7f8;--line:#dbe6e9}
:root[data-tone=sky]{--teal:#1e3a8a;--teal2:#2563eb;--tsoft:#dbeafe;--gold:#facc15;--gsoft:#fef3c7;--deep:#172a63;--gink:#3a2f00;--gink2:#8a6a00;--ink:#0f1f3d;--muted:#52607a;--page:#edf3ff;--soft:#eef4ff;--line:#d3e0fb}
:root[data-tone=green]{--teal:#0b5d2e;--teal2:#16a34a;--tsoft:#dcfce7;--gold:#facc15;--gsoft:#fef9c3;--deep:#063d1e;--gink:#3a2f00;--gink2:#8a6a00;--ink:#0f2a1a;--muted:#4b6b57;--page:#ecfaf1;--soft:#effbf3;--line:#cdeedb}
:root[data-tone=orange]{--teal:#9a3412;--teal2:#ea580c;--tsoft:#ffedd5;--gold:#38bdf8;--gsoft:#e0f2fe;--deep:#6b240c;--gink:#062a40;--gink2:#0369a1;--ink:#2b1a10;--muted:#7a5a48;--page:#fff2e8;--soft:#fff4ec;--line:#f7dcc6}
:root[data-tone=purple]{--teal:#4c1d95;--teal2:#7c3aed;--tsoft:#ede9fe;--gold:#f472b6;--gsoft:#fce7f3;--deep:#321266;--gink:#4a0a2b;--gink2:#be185d;--ink:#24123f;--muted:#6b5a85;--page:#f5f0ff;--soft:#f4efff;--line:#e2d8fb}
.brand img{background:#fff}
.theme-dots{display:flex;gap:7px;align-items:center;margin:0 0 10px}
.theme-dots span{font-size:calc(12.5px * var(--fsk));opacity:.85;margin-inline-end:2px}
.theme-dots button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.55);padding:0;cursor:pointer;min-height:0}
.theme-dots button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}

/* ===== جدول الحصص ===== */
.sched-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
table.sched{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
table.sched th,table.sched td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
table.sched tr>*:first-child{border-inline-start:0}
table.sched tr:last-child>*{border-bottom:0}
table.sched thead th{background:var(--teal);color:#fff;font-size:calc(15px * var(--fsk));padding:12px 8px;position:sticky;top:0}
table.sched thead th.today{background:var(--gold);color:var(--gink)}
table.sched th.pn{background:var(--tsoft);color:var(--teal);width:118px;font-size:calc(14px * var(--fsk));line-height:1.4}
table.sched th.pn b{display:block;font-size:calc(16px * var(--fsk))}
table.sched th.pn small{color:var(--muted);font-weight:600}
table.sched td.today{background:color-mix(in srgb,var(--gold) 9%,var(--paper))}
table.sched tr.now th.pn{background:var(--gold);color:var(--gink)}
table.sched tr.now th.pn small{color:var(--gink)}
table.sched td.now-cell{box-shadow:inset 0 0 0 3px var(--gold)}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:58px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted);font-weight:600;padding:6px}
.slot:hover{border-color:var(--teal2);color:var(--teal2)}
.slot.on{border:0;background:var(--cc)}
.slot.on b{font-size:calc(15px * var(--fsk))}
.slot.on small{font-size:calc(12px * var(--fsk));opacity:.9}
.slot.break{min-height:0;border:0;color:var(--muted);cursor:default}
.tsched .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tsched .row:last-child{border-bottom:0}
.tsched .pnum{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tsoft);color:var(--teal);font-weight:800;flex:none}
.tsched .row.now .pnum{background:var(--gold);color:var(--gink)}
.tsched .cdot{width:12px;height:12px;border-radius:4px;flex:none}
.sched-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sched-tools label{display:flex;gap:8px;align-items:center;font-weight:700}
.sched-tools select{min-height:42px;border-radius:12px;border:1px solid var(--line);padding:0 10px;background:var(--paper)}
.times-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.times-grid input{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px}
@media print{aside,.top,.sched-tools,.toast{display:none!important}.app{display:block}main{padding:0}table.sched{min-width:0}.slot{border:0}.sched-wrap{border:0}}

/* ===== حماية البيانات: تذكير النسخ الاحتياطي والنسخ التلقائية ===== */
.backup-nudge{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(135deg,var(--gsoft),var(--paper))}
.backup-nudge .bn-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold);color:var(--gink);flex:none;font-size:calc(22px * var(--fsk))}
.backup-nudge .grow{flex:1;min-width:220px}
.backup-nudge b{display:block;font-size:calc(17px * var(--fsk))}
.snaps{display:grid;gap:8px;margin-top:6px}
.snap-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.snap-row .grow{flex:1}
.snap-row small{color:var(--muted)}
.side-backup{font-size:calc(12.5px * var(--fsk));opacity:.85;margin:6px 0 0;display:flex;gap:6px;align-items:center}
.side-backup i{width:8px;height:8px;border-radius:50%;background:#7ad19b;flex:none}
.side-backup.old i{background:var(--gold)}
</style>
</head>

<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh"><h2 id="dlgT" style="font-size:calc(19px * var(--fsk))"></h2><button class="x" type="button" id="dlgX" aria-label="إغلاق">×</button></div><div class="db" id="dlgB"></div><div class="df"><button class="btn pri" type="submit" value="ok" id="dlgOk">حفظ</button><button class="btn" type="button" id="dlgC">إلغاء</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
const KEY="basma-athar-v1";
const LEVELS=[{n:"مستكشف رقمي",i:"compass",c:"#5b7c99",min:0},{n:"مبرمج ناشئ",i:"code",c:"#1d8a84",min:20},{n:"مطوّر ماهر",i:"cpu",c:"#4b5bb7",min:50},{n:"مبتكر",i:"rocket",c:"#c0602b",min:100},{n:"صانع الأثر",i:"crown",c:"#b8862b",min:200}];
const ic=(n,c)=>`<svg class="ic ${c||""}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const lvTag=l=>`<span class="lv" style="background:${l.c}1f;color:${l.c}">${ic(l.i)}${l.n}</span>`;
const REASONS=[{t:"مشاركة",v:1,i:"msg"},{t:"تعاون",v:1,i:"users"},{t:"إبداع",v:2,i:"bulb"},{t:"إتقان المهمة",v:2,i:"award"},{t:"انضباط",v:1,i:"target"},{t:"سلوك يحتاج تحسين",v:-1,i:"alert"}];
let D;
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}D=D||{};D.classes=D.classes||[];D.students=D.students||[];D.att=D.att||{};D.points=D.points||[];D.cur=D.cur||(D.classes[0]&&D.classes[0].id)||"";}
function save(){D.meta=D.meta||{};if(!D.meta.dirtySince)D.meta.dirtySince=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("تعذّر الحفظ على هذا الجهاز")}snapLater()}
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}
const cls=id=>D.classes.find(c=>c.id===id);
const studs=cid=>D.students.filter(s=>s.classId===cid).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
const ptsOf=(sid,since)=>D.points.filter(p=>p.sid===sid&&(!since||p.t>=since)).reduce((a,p)=>a+p.v,0);
const levelOf=n=>{let l=LEVELS[0];LEVELS.forEach(x=>{if(n>=x.min)l=x});return l};
const nextLevel=n=>LEVELS.find(x=>x.min>Math.max(0,n));
function absences(sid){let n=0;for(const k in D.att){if(D.att[k][sid]==="a")n++}return n}
function since(range){const d=new Date();if(range==="day"){d.setHours(0,0,0,0)}else if(range==="week"){d.setDate(d.getDate()-7)}else if(range==="month"){d.setMonth(d.getMonth()-1)}else return 0;return d.getTime()}

/* نافذة إدخال عامة */
function ask(title,fields,ok,okText){
  const B=$("#dlgB");B.innerHTML="";$("#dlgT").textContent=title;$("#dlgOk").textContent=okText||"حفظ";
  fields.forEach(f=>{const l=document.createElement("label");l.textContent=f.label;let i;
    if(f.type==="textarea"){i=document.createElement("textarea")}else if(f.type==="select"){i=document.createElement("select");f.options.forEach(o=>{const op=document.createElement("option");op.value=o.v;op.textContent=o.t;i.append(op)})}else{i=document.createElement("input");i.type=f.type||"text"}
    i.name=f.name;if(f.value!=null)i.value=f.value;if(f.placeholder)i.placeholder=f.placeholder;l.append(i);if(f.hint){const s=document.createElement("small");s.className="muted";s.textContent=f.hint;l.append(s)}B.append(l)});
  const dlg=$("#dlg");dlg.returnValue="";dlg.showModal();
  dlg.onclose=()=>{if(dlg.returnValue==="ok"){const v={};fields.forEach(f=>v[f.name]=B.querySelector("[name='"+f.name+"']").value.trim());ok(v)}};
}
$("#dlgX").onclick=()=>$("#dlg").close();$("#dlgC").onclick=()=>$("#dlg").close();

/* التنقل */
let V="home";
const TITLES={home:"نظرة عامة",classes:"الصفوف",students:"الطلاب",att:"الحضور",points:"النقاط",path:"مسار الإنجاز",sched:"جدول الحصص",settings:"النسخ الاحتياطي"};
function go(v){V=v;document.querySelectorAll("#nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v===v));if(document.querySelector("#nav button[aria-current]"))document.querySelector("#nav button[aria-current]").setAttribute("aria-current","page");$("#vt").textContent=TITLES[v];render();try{history.replaceState(null,"","#"+v)}catch(e){}}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function fillClassSel(){const s=$("#curClass");s.innerHTML="";if(!D.classes.length){const o=document.createElement("option");o.textContent="لا توجد صفوف بعد";o.value="";s.append(o);s.disabled=true;return}s.disabled=false;D.classes.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;s.append(o)});if(!cls(D.cur))D.cur=D.classes[0].id;s.value=D.cur}
$("#curClass").onchange=e=>{D.cur=e.target.value;save();render()};
const needClass=()=>D.classes.length?"":'<div class="card empty"><b>ابدئي بإضافة صفكِ الأول</b>أضيفي صفًا ثم أسماء الطلاب، وكل شيء يُحفظ على جهازكِ.<div style="margin-top:12px"><button class="btn pri" type="button" data-act="addClass">+ إضافة صف</button></div></div>';

function render(){
  fillClassSel();const W=$("#view");const c=cls(D.cur);
  if(V==="sched"){renderSched(W);return}
  if(V==="home"){
    if(!D.classes.length){W.innerHTML='<div class="card" style="margin-bottom:14px"><h2>أهلًا بكِ في بصمة أثر</h2><p class="muted" style="margin:0">لوحة صغيرة تساعدكِ في إدارة صفوفكِ داخل الحصة: الحضور، ونقاط التحفيز، ومسار الإنجاز، ووضع الحصة بالقرعة والمجموعات والمؤقت.</p></div>'+needClass();return}
    const S=D.students,today=todayISO();let pres=0,abs=0;D.classes.forEach(k=>{const a=D.att[today+"|"+k.id]||{};for(const sid in a){if(a[sid]==="a")abs++;else pres++}});
    const range=W.dataset.range||"week";
    const ranked=S.map(s=>({s,p:ptsOf(s.id,since(range))})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,5);
    const follow=S.map(s=>({s,a:absences(s.id),n:D.points.filter(p=>p.sid===s.id&&p.v<0).length})).filter(x=>x.a>=3||x.n>=3).slice(0,6);
    const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const e=d.getTime()+864e5;days.push({l:d.toLocaleDateString("ar-OM",{weekday:"short"}),v:D.points.filter(p=>p.t>=d.getTime()&&p.t<e&&p.v>0).reduce((a,p)=>a+p.v,0)})}
    const mx=Math.max(1,...days.map(d=>d.v));
    const recent=D.points.slice(-6).reverse();
    W.innerHTML=`<div class="grid kpis" style="margin-bottom:14px">
      <div class="card kpi"><div class="v">${D.classes.length}</div><div class="l">صف</div></div>
      <div class="card kpi"><div class="v">${S.length}</div><div class="l">طالب وطالبة</div></div>
      <div class="card kpi"><div class="v">${pres}<small class="muted" style="font-size:calc(16px * var(--fsk))"> / ${abs} غياب</small></div><div class="l">حضور اليوم</div></div>
      <div class="card kpi"><div class="v">${D.points.filter(p=>p.t>=since("week")&&p.v>0).reduce((a,p)=>a+p.v,0)}</div><div class="l">نقطة تحفيز هذا الأسبوع</div></div></div>
     <div class="grid two" style="margin-bottom:14px">
      <div class="card"><h2><span style="display:flex;gap:8px;align-items:center">${ic("trophy")}أعلى 5 طلاب</span> <span class="toolbar" style="margin:0;gap:4px">${[["day","اليوم"],["week","الأسبوع"],["month","الشهر"],["all","الكل"]].map(([k,t])=>`<button class="btn s ${range===k?"pri":""}" type="button" data-range="${k}">${t}</button>`).join("")}</span></h2>
        ${ranked.length?ranked.map((x,i)=>`<div class="row"><span class="rank r${i+1}">${i+1}</span><span class="grow"><b>${esc(x.s.name)}</b><br><span class="sm muted">${esc((cls(x.s.classId)||{}).name)}</span></span><span class="pill gold">${x.p} نقطة</span></div>`).join(""):'<div class="empty">لا توجد نقاط في هذه الفترة</div>'}</div>
      <div class="card"><h2><span style="display:flex;gap:8px;align-items:center">${ic("bell")}يحتاجون متابعة</span></h2>${follow.length?follow.map(x=>`<div class="row"><span class="av">${esc(x.s.name[0])}</span><span class="grow"><b>${esc(x.s.name)}</b><br><span class="sm muted">${esc((cls(x.s.classId)||{}).name)}</span></span>${x.a>=3?`<span class="pill b">${x.a} غياب</span>`:""}${x.n>=3?`<span class="pill w">${x.n} ملاحظات سلوك</span>`:""}</div>`).join(""):'<div class="empty"><b>الجميع بخير</b>يظهر هنا من غاب 3 مرات أو أكثر، أو تكررت عليه ملاحظات السلوك.</div>'}</div></div>
     <div class="grid two">
      <div class="card"><h2><span style="display:flex;gap:8px;align-items:center">${ic("chart")}نقاط التحفيز آخر 7 أيام</span></h2><div class="bars">${days.map(d=>`<div><b style="color:var(--ink)">${d.v}</b><span style="height:${Math.round(d.v/mx*100)}%"></span>${d.l}</div>`).join("")}</div></div>
      <div class="card"><h2><span style="display:flex;gap:8px;align-items:center">${ic("clock")}آخر النشاط</span></h2>${recent.length?recent.map(p=>{const s=D.students.find(x=>x.id===p.sid);return s?`<div class="row"><span class="grow">${esc(s.name)} · <span class="muted sm">${esc(p.r)}</span></span><span class="pill ${p.v>0?"g":"b"}">${p.v>0?"+":""}${p.v}</span></div>`:""}).join(""):'<div class="empty">سيظهر هنا سجل النقاط التي تضيفينها</div>'}</div></div>`;
    W.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{W.dataset.range=b.dataset.range;render()});
  }
  else if(V==="classes"){
    W.innerHTML=`<div class="toolbar"><button class="btn pri" type="button" data-act="addClass">+ إضافة صف</button></div>`+(D.classes.length?`<div class="grid three">${D.classes.map(k=>{const n=studs(k.id).length;const p=studs(k.id).reduce((a,s)=>a+ptsOf(s.id),0);return `<div class="card cls"><h3 style="display:flex;gap:8px;align-items:center">${ic("school","lg")}${esc(k.name)}</h3><span class="muted sm">${esc(k.grade||"")}</span><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">${n} طالب</span><span class="pill gold">${p} نقطة</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn s" type="button" data-open="${k.id}">فتح الطلاب</button><button class="btn s" type="button" data-ren="${k.id}">تعديل</button><button class="btn s bad" type="button" data-del="${k.id}">حذف</button></div></div>`}).join("")}</div>`:needClass());
    W.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{D.cur=b.dataset.open;save();go("students")});
    W.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>{const k=cls(b.dataset.ren);ask("تعديل الصف",[{name:"name",label:"اسم الصف",value:k.name},{name:"grade",label:"وصف قصير (اختياري)",value:k.grade}],v=>{if(!v.name)return;k.name=v.name;k.grade=v.grade;save();render()})});
    W.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const k=cls(b.dataset.del);if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="تأكيد الحذف؟";setTimeout(()=>{b.dataset.armed="";b.textContent="حذف"},3000);return}const ids=new Set(studs(k.id).map(s=>s.id));D.students=D.students.filter(s=>s.classId!==k.id);D.points=D.points.filter(p=>!ids.has(p.sid));D.classes=D.classes.filter(c=>c.id!==k.id);if(D.cur===k.id)D.cur=(D.classes[0]||{}).id||"";save();render();toast("حُذف الصف")});
  }
  else if(V==="students"){
    if(!c){W.innerHTML=needClass();return}
    const L=studs(c.id);

function addClass(){ask("إضافة صف",[{name:"name",label:"اسم الصف",placeholder:"مثال: الصف الرابع / 2"},{name:"grade",label:"وصف قصير (اختياري)",placeholder:"مثال: الحصة الثالثة · مختبر 1"}],v=>{if(!v.name){toast("اكتبي اسم الصف");return}const k={id:uid(),name:v.name,grade:v.grade};D.classes.push(k);D.cur=k.id;save();render();toast("أُضيف الصف")})}

function addPoint(sid,r){D.points.push({id:uid(),sid,v:r.v,r:r.t,t:Date.now()});save();const s=D.students.find(x=>x.id===sid);const p=ptsOf(sid);const before=p-r.v;if(levelOf(p).min>levelOf(before).min)toast("تهانينا! "+s.name+" انتقل إلى مرحلة «"+levelOf(p).n+"»");else toast((r.v>0?"+":"")+r.v+" · "+s.name);if($("#cm").classList.contains("on"))cmRender();else render()}

function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.2,A.currentTime+d);o.start(A.currentTime+d);o.stop(A.currentTime+d+.18)})}catch(e){}}

const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const DEF_TIMES=[["07:30","08:10"],["08:15","08:55"],["09:00","09:40"],["09:55","10:35"],["10:40","11:20"],["11:35","12:15"],["12:20","13:00"],["13:05","13:45"],["13:50","14:30"]];
const PN=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة"];
function SC(){D.sched=D.sched||{};const x=D.sched;x.n=x.n||8;x.times=x.times||DEF_TIMES.map(t=>t.slice());x.cells=x.cells||{};return x}
function clsColor(id){const i=D.classes.findIndex(c=>c.id===id);const cs=getComputedStyle(document.documentElement);const base=[cs.getPropertyValue("--teal2"),cs.getPropertyValue("--teal"),cs.getPropertyValue("--gold"),"#3d8a6e","#a0566a","#4f6fb0","#b07a2a","#5c7f8f"];return (base[i%base.length]||"#225c78").trim()}
const txtOn=h=>{h=String(h).trim().replace("#","");if(h.length===3)h=h.replace(/./g,"$&$&");const n=parseInt(h,16);if(isNaN(n))return"#fff";const r=n>>16&255,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?"#2a1a0a":"#fff"};
const mins=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?(+m[1])*60+(+m[2]):-1};
function nowInfo(){const d=new Date();const day=d.getDay();const di=day<=4?day:-1;const m=d.getHours()*60+d.getMinutes();const x=SC();let p=-1;for(let i=0;i<x.n;i++){const a=mins(x.times[i]&&x.times[i][0]),b=mins(x.times[i]&&x.times[i][1]);if(a>=0&&m>=a&&m<b){p=i;break}}return{di,p,m}}

  W.querySelectorAll(".slot[data-d]").forEach(b=>b.onclick=()=>{const key=b.dataset.d+"|"+b.dataset.p;const cell=x.cells[key]||{};
    if(!D.classes.length){toast("أضيفي صفًا أولًا من قسم «الصفوف»");return}
    ask(DAYS[+b.dataset.d]+" · الحصة "+PN[+b.dataset.p],[{name:"c",label:"الصف",type:"select",options:[{v:"",t:"— حصة فارغة —"}].concat(D.classes.map(c=>({v:c.id,t:c.name}))),value:cell.c||""},{name:"n",label:"ملاحظة (اختياري)",placeholder:"مثال: مختبر ٢ · درس الجداول الإلكترونية",value:cell.n||""}],v=>{if(!v.c){delete x.cells[key]}else{x.cells[key]={c:v.c,n:v.n}}save();render()})});
}
function todaySchedCard(){const x=SC(),N=nowInfo();if(N.di<0)return`<div class="card tsched" style="margin-bottom:14px"><h2 style="display:flex;gap:8px;align-items:center">${ic("cal")}حصص اليوم</h2><p class="muted" style="margin:6px 0 0">لا توجد حصص اليوم. نهاية أسبوع سعيدة.</p></div>`;
  const rows=[];let next=-1;for(let p=0;p<x.n;p++){const cell=x.cells[N.di+"|"+p];const k=cell&&cls(cell.c);if(!k)continue;const a=mins((x.times[p]||[])[0]);if(next<0&&a>N.m)next=p;rows.push({p,k,cell})}
  return`<div class="card tsched" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="display:flex;gap:8px;align-items:center">${ic("cal")}حصص اليوم · ${DAYS[N.di]}</h2><button class="btn s" type="button" data-go="sched">فتح الجدول</button></div>${rows.length?rows.map(r=>`<div class="row ${r.p===N.p?"now":""}"><span class="pnum">${r.p+1}</span><span class="cdot" style="background:${clsColor(r.k.id)}"></span><span class="grow"><b>${esc(r.k.name)}</b>${r.cell.n?` <span class="muted sm">· ${esc(r.cell.n)}</span>`:""}</span><span class="muted sm">${esc((x.times[r.p]||[])[0]||"")}</span>${r.p===N.p?'<span class="pill gold">الآن</span>':r.p===next?'<span class="pill g">التالية</span>':""}</div>`).join(""):`<p class="muted" style="margin:6px 0 0">لم تُضف حصص لهذا اليوم بعد. <button class="btn s" type="button" data-go="sched">إعداد الجدول</button></p>`}</div>`}
new MutationObserver(()=>{if(V!=="home"||!D.classes.length)return;const W=$("#view");if(W.querySelector(".tsched"))return;W.insertAdjacentHTML("afterbegin",todaySchedCard());W.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}).observe($("#view"),{childList:true});

/* ===== مزامنة المظهر مع منصة أثر ===== */
{const T=[["iris","الهوية","#225c78"],["sky","أزرق","#2563eb"],["green","أخضر","#16a34a"],["orange","برتقالي","#ea580c"],["purple","بنفسجي","#7c3aed"]];const box=$("#themeDots");
 const sync=()=>{const cur=document.documentElement.dataset.tone;box.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===cur))};
 T.forEach(([k,n,c])=>{const b=document.createElement("button");b.type="button";b.dataset.t=k;b.title="المظهر: "+n;b.setAttribute("aria-label","المظهر: "+n);b.style.background=c;b.onclick=()=>{document.documentElement.dataset.tone=k;try{localStorage.setItem("athar-tone",k)}catch(e){}sync();render()};box.append(b)});
 addEventListener("storage",e=>{if(e.key==="athar-tone"&&e.newValue){document.documentElement.dataset.tone=e.newValue;sync();render()}});sync();}

/* ===== حماية البيانات ===== */
const SNAPKEY="basma-athar-snaps";
const fmtDay=t=>new Date(t).toLocaleDateString("ar-OM",{weekday:"long",day:"numeric",month:"long"});
const fmtTime=t=>new Date(t).toLocaleTimeString("ar-OM",{hour:"numeric",minute:"2-digit"});
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAPKEY))||[]}catch(e){return[]}}
function putSnaps(a){while(a.length){try{localStorage.setItem(SNAPKEY,JSON.stringify(a));return true}catch(e){a.shift()}}try{localStorage.removeItem(SNAPKEY)}catch(e){}return false}
function hasData(x){return x&&((x.classes||[]).length||(x.students||[]).length)}
function takeSnap(label,force){if(!hasData(D))return;const a=getSnaps();const day=todayISO();const data=JSON.stringify(D);
  if(!force){const i=a.findIndex(x=>x.day===day&&!x.label);if(i>=0){a[i]={day,t:Date.now(),data};putSnaps(a);return}}
  a.push({day,t:Date.now(),label:label||"",data});
  const days=[...new Set(a.map(x=>x.day))].sort();while(days.length>7){const old=days.shift();for(let i=a.length-1;i>=0;i--)if(a[i].day===old)a.splice(i,1)}
  while(a.length>12)a.shift();putSnaps(a)}
let _snapT=0;function snapLater(){clearTimeout(_snapT);_snapT=setTimeout(()=>takeSnap(),1500)}
function snapsList(){const a=getSnaps().slice().reverse();if(!a.length)return'<p class="muted sm" style="margin:0">لا توجد نسخ تلقائية بعد. ستظهر هنا بعد أول تعديل.</p>';
  return'<div class="snaps">'+a.map((x,i)=>{let n={};try{n=JSON.parse(x.data)}catch(e){}const idx=a.length-1-i;
    return`<div class="snap-row"><span class="grow"><b>${esc(fmtDay(x.t))}</b> <small>· ${esc(fmtTime(x.t))}${x.label?" · "+esc(x.label):""}</small><br><small>${(n.classes||[]).length} صف · ${(n.students||[]).length} طالب · ${(n.points||[]).length} نقطة</small></span><button class="btn s" type="button" data-snap="${idx}">استرجاع</button></div>`}).join("")+'</div>'}
function restoreSnap(i){const a=getSnaps();const x=a[i];if(!x)return;takeSnap("قبل استرجاع نسخة تلقائية",true);try{localStorage.setItem(KEY,x.data)}catch(e){toast("تعذّر الاسترجاع");return}load();render();toast("تم الاسترجاع إلى نسخة "+fmtDay(x.t))}
function markExported(){D.meta=D.meta||{};D.meta.lastExport=Date.now();D.meta.dirtySince=0;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}setTimeout(sideBackup,50)}
function daysSince(t){return t?Math.floor((Date.now()-t)/864e5):Infinity}
function lastExportTxt(){const t=D.meta&&D.meta.lastExport;if(!t)return"لم تُنزَّل نسخة بعد";const d=daysSince(t);return d===0?"اليوم":d===1?"أمس":"قبل "+d+" أيام"}
function needNudge(){if(!hasData(D))return false;const m=D.meta||{};if(m.snoozeUntil&&Date.now()<m.snoozeUntil)return false;if(!m.lastExport)return true;return daysSince(m.lastExport)>=7&&!!m.dirtySince}
function nudgeCard(){const m=D.meta||{};return`<div class="card backup-nudge" role="status"><span class="bn-ic" aria-hidden="true">🛡️</span><span class="grow"><b>احمي بيانات صفوفكِ</b><span class="muted sm">${m.lastExport?"آخر نسخة احتياطية منزّلة "+lastExportTxt()+"، وفيها تعديلات جديدة لم تُحفظ.":"لم تنزّلي نسخة احتياطية بعد. البيانات محفوظة في هذا المتصفح فقط، وقد تضيع إذا مُسح أو تغيّر الجهاز."}</span></span><button class="btn gold" type="button" data-bk="now">${ic("down")}تنزيل نسخة الآن</button><button class="btn s" type="button" data-bk="later">ذكّريني بعد ٣ أيام</button></div>`}
function sideBackup(){const f=document.querySelector(".side-foot");if(!f)return;let el=f.querySelector(".side-backup");if(!el){el=document.createElement("p");el.className="side-backup";f.append(el)}const old=!D.meta||!D.meta.lastExport||daysSince(D.meta.lastExport)>=7;el.classList.toggle("old",old);el.innerHTML='<i aria-hidden="true"></i>آخر نسخة احتياطية: '+esc(lastExportTxt())}
new MutationObserver(()=>{if(V!=="home")return;const W=$("#view");if(W.querySelector(".backup-nudge")||!needNudge())return;W.insertAdjacentHTML("afterbegin",nudgeCard());
  W.querySelector('[data-bk=now]').onclick=()=>{go("settings");setTimeout(()=>$("#exp")&&$("#exp").click(),60)};
  W.querySelector('[data-bk=later]').onclick=()=>{D.meta=D.meta||{};D.meta.snoozeUntil=Date.now()+3*864e5;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}W.querySelector(".backup-nudge")?.remove()}}).observe($("#view"),{childList:true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

load();sideBackup&&setTimeout(sideBackup,0);
$("#today").textContent=new Date().toLocaleDateString("ar-OM",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const h=(location.hash||"").slice(1);go(TITLES[h]?h:"home");
}
