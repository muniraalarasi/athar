<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الدرس | منصة أثر</title>
<style>
:root{--teal:#163f52;--teal2:#225c78;--soft:#eef5f7;--gold:#d9a64e;--goldsoft:#fbf1dc;--violet:#6a3f9e;--vsoft:#f2ecf8;--ink:#17303b;--muted:#5a7380;--line:#dbe6e9}
*{box-sizing:border-box}
body{margin:0;background:#eef3f4;color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.8}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.sheet{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(22,63,82,.1);overflow:hidden}
header{background:linear-gradient(125deg,var(--teal),var(--teal2));color:#fff;padding:22px 26px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header .bdg{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 14px;font-size:14px}
header h1{margin:8px 0 2px;font-size:30px;line-height:1.3}
header .unit{opacity:.85;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools a{background:var(--gold);color:#3a2806;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.tools .alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
main{padding:20px 26px 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.box h2{margin:0 0 8px;font-size:19px;color:var(--teal);display:flex;align-items:center;gap:8px}
.box h2 .i{font-size:22px}
.full{grid-column:1/-1}
ul,ol{margin:0;padding-inline-start:22px}
li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:15px;font-weight:700;color:var(--teal)}
.warm{background:var(--goldsoft);border-color:#efd9a8}
.act{background:#eef8f1;border-color:#bfe3cb}
.act h2{color:#1f7a4c}
.ld{background:var(--vsoft);border-color:#dccdf0}
.ld h2{color:var(--violet)}
.exit ol li{padding:4px 0;border-bottom:1px dashed var(--line)}
.exit ol li:last-child{border:0}
.steps ol li{margin:6px 0}
.story{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,#fff7e6,#fff);border-color:#f0dcb4}
.story a{background:var(--teal);color:#fff;text-decoration:none;border-radius:12px;padding:9px 18px;font-weight:700}
footer{padding:12px 26px 20px;color:var(--muted);font-size:13.5px;text-align:center}
.msg{padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){main{grid-template-columns:1fr}header h1{font-size:24px}}
@media print{body{background:#fff;font-size:12.5pt}.wrap{padding:0;max-width:none}.sheet{box-shadow:none;border-radius:0}.tools,.story a{display:none}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}.box{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:12mm}}
</style>
</head>
<body>
<div class="wrap"><div class="sheet" id="m"><div class="msg">جارٍ تحميل بطاقة الدرس…</div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const li=a=>(a||[]).map(x=>"<li>"+esc(x)+"</li>").join("");
window.CARD=d=>{
  document.title="بطاقة الدرس: "+d.title+" | منصة أثر";
  $("#m").innerHTML=`
  <header><div><span class="bdg">${esc(d.badge)}</span><h1>${esc(d.title)}</h1><div class="unit">الوحدة: ${esc(d.unit)}</div></div>
   <div class="tools"><button type="button" data-a="print">🖨️ طباعة / حفظ PDF</button>${d.story?`<a class="alt" href="${esc(d.story)}">📖 القصة التفاعلية</a>`:""}</div></header>
  <main>
   <section class="box"><h2><span class="i">🎯</span>أهداف الدرس</h2><ul>${li(d.goals)}</ul></section>
   <section class="box"><h2><span class="i">🔤</span>مفردات الدرس</h2><div class="chips">${(d.vocab||[]).map(v=>"<span>"+esc(v)+"</span>").join("")}</div>
     ${d.tools?`<h2 style="margin-top:12px"><span class="i">🧰</span>الأدوات</h2><p style="margin:0">${esc(d.tools)}</p>`:""}</section>
   <section class="box warm full"><h2><span class="i">✨</span>التمهيد (3–5 دقائق)</h2><p style="margin:0">${esc(d.warm)}</p></section>
   <section class="box steps full"><h2><span class="i">🪜</span>خطوات تنفيذ الدرس</h2><ol>${li(d.steps)}</ol></section>
   <section class="box act full"><h2><span class="i">💻</span>النشاط العملي على الجهاز</h2><p style="margin:0">${esc(d.act)}</p></section>
   <section class="box exit"><h2><span class="i">🎟️</span>تذكرة الخروج</h2><ol>${li(d.exit)}</ol></section>
   <section class="box ld"><h2><span class="i">🤝</span>دعم طلبة صعوبات التعلم</h2><p style="margin:0">${esc(d.ld)}</p></section>
   ${d.story?`<section class="box story full"><div><b>📖 القصة التفاعلية: ${esc(d.storyTitle||"")}</b><br><span style="color:var(--muted);font-size:15px">تُعرض على السبورة التفاعلية في نهاية الدرس أو يتفاعل معها الطلبة على أجهزتهم.</span></div><a href="${esc(d.story)}">ابدأ القصة ✨</a></section>`:""}
  </main>
  <footer>بطاقة درس من منصة أثر · معًا نُلهم لنصنع أثرًا · القصص التفاعلية بأسلوب منصة الأستاذة عبير اليحمدي</footer>`;
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&b.dataset.a==="print")window.print();});
(function(){const d=(new URLSearchParams(location.search).get("d")||"").replace(/[^\w-]/g,"");
 if(!d){$("#m").innerHTML='<div class="msg">افتح بطاقة الدرس من صفحة الصف في منصة أثر.</div>';return;}
 const s=document.createElement("script");s.src="card-"+d+".js";s.onerror=()=>{$("#m").innerHTML='<div class="msg">لم يُعثر على بطاقة هذا الدرس.</div>';};document.head.appendChild(s);})();
</script>
</body>
</html>
